<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Data Viewer - WalaPlus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --qms-blue: #1E3A8A;
            --qms-blue-light: #2563EB;
            --qms-blue-bg: #DBEAFE;
            --qms-green: #047857;
            --qms-green-light: #22C55E;
            --qms-green-bg: #D1FAE5;
            --qms-amber: #D97706;
            --qms-amber-light: #F59E0B;
            --qms-amber-bg: #FEF3C7;
            --qms-red: #B91C1C;
            --qms-red-light: #EF4444;
            --qms-red-bg: #FEE2E2;
            --qms-purple: #6D28D9;
            --qms-purple-light: #A855F7;
            --qms-purple-bg: #EDE9FE;
        }
        html, body { 
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        body {
            min-height: 100vh;
            overflow-x: hidden;
        }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .tab-active { border-bottom: 2px solid var(--qms-blue); color: var(--qms-blue); font-weight: 600; }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--qms-blue);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .table-container {
            max-height: 600px;
            overflow-y: auto;
        }
        .table-container::-webkit-scrollbar { width: 8px; }
        .table-container::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
    <link rel="stylesheet" href="/css/navigation.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="walaplus-nav"></div>
    <script src="/js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            WalaPlusNav.init('crm');
        });
    </script>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Zoho CRM Data Viewer</h1>
                    <p class="text-gray-500 text-sm mt-1">Real-time data from your Zoho CRM</p>
                </div>
                <div class="flex items-center space-x-3">
                    <span id="connectionStatus" class="px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-sm">Checking...</span>
                    <span id="lastUpdated" class="text-xs text-gray-400"></span>
                    <button onclick="refreshData()" id="refreshBtn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition flex items-center space-x-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        <span>Refresh</span>
                    </button>
                </div>
            </div>

            <div class="border-b border-gray-200 mb-6">
                <nav class="flex space-x-8" id="moduleTabs">
                    <button onclick="switchModule('Leads')" data-module="Leads" class="py-3 px-1 text-sm font-medium text-gray-500 hover:text-gray-700 border-b-2 border-transparent hover:border-gray-300 tab-active">
                        Leads
                    </button>
                    <button onclick="switchModule('Deals')" data-module="Deals" class="py-3 px-1 text-sm font-medium text-gray-500 hover:text-gray-700 border-b-2 border-transparent hover:border-gray-300">
                        Deals
                    </button>
                    <button onclick="switchModule('Contacts')" data-module="Contacts" class="py-3 px-1 text-sm font-medium text-gray-500 hover:text-gray-700 border-b-2 border-transparent hover:border-gray-300">
                        Contacts
                    </button>
                    <button onclick="switchModule('Tasks')" data-module="Tasks" class="py-3 px-1 text-sm font-medium text-gray-500 hover:text-gray-700 border-b-2 border-transparent hover:border-gray-300">
                        Tasks
                    </button>
                    <button onclick="switchModule('Accounts')" data-module="Accounts" class="py-3 px-1 text-sm font-medium text-gray-500 hover:text-gray-700 border-b-2 border-transparent hover:border-gray-300">
                        Accounts
                    </button>
                </nav>
            </div>

            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-4">
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Search records..." 
                            class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 w-64"
                            onkeyup="filterTable()">
                        <svg class="absolute left-3 top-2.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </div>
                    <span id="recordCount" class="text-sm text-gray-500">0 records</span>
                </div>
                <div class="flex items-center space-x-2">
                    <label class="text-sm text-gray-500">Per page:</label>
                    <select id="perPageSelect" onchange="refreshData()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">
                        <option value="25">25</option>
                        <option value="50" selected>50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>

            <div id="loadingState" class="hidden py-12 text-center">
                <div class="loading-spinner mx-auto mb-4"></div>
                <p class="text-gray-500">Loading CRM data...</p>
            </div>

            <div id="errorState" class="hidden py-12 text-center">
                <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                </div>
                <p id="errorMessage" class="text-red-600 font-medium mb-2">Error loading data</p>
                <button onclick="refreshData()" class="text-indigo-600 hover:text-indigo-800 text-sm">Try again</button>
            </div>

            <div id="dataContainer" class="table-container">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50 sticky top-0">
                        <tr id="tableHeader"></tr>
                    </thead>
                    <tbody id="tableBody" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>

            <div id="emptyState" class="hidden py-12 text-center">
                <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
                    </svg>
                </div>
                <p class="text-gray-500">No records found in this module</p>
            </div>

            <div id="pagination" class="flex items-center justify-between mt-4 pt-4 border-t border-gray-200">
                <button onclick="previousPage()" id="prevBtn" class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    Previous
                </button>
                <span id="pageInfo" class="text-sm text-gray-500">Page 1</span>
                <button onclick="nextPage()" id="nextBtn" class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    Next
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">Module Statistics</h2>
            <div id="moduleStats" class="grid grid-cols-2 md:grid-cols-5 gap-4">
                <div class="bg-blue-50 p-4 rounded-lg text-center">
                    <div id="leadsCount" class="text-2xl font-bold text-blue-600">--</div>
                    <div class="text-sm text-blue-800">Leads</div>
                </div>
                <div class="bg-green-50 p-4 rounded-lg text-center">
                    <div id="dealsCount" class="text-2xl font-bold text-green-600">--</div>
                    <div class="text-sm text-green-800">Deals</div>
                </div>
                <div class="bg-purple-50 p-4 rounded-lg text-center">
                    <div id="contactsCount" class="text-2xl font-bold text-purple-600">--</div>
                    <div class="text-sm text-purple-800">Contacts</div>
                </div>
                <div class="bg-amber-50 p-4 rounded-lg text-center">
                    <div id="tasksCount" class="text-2xl font-bold text-amber-600">--</div>
                    <div class="text-sm text-amber-800">Tasks</div>
                </div>
                <div class="bg-cyan-50 p-4 rounded-lg text-center">
                    <div id="accountsCount" class="text-2xl font-bold text-cyan-600">--</div>
                    <div class="text-sm text-cyan-800">Accounts</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentModule = 'Leads';
        let currentPage = 1;
        let allRecords = [];

        const moduleColumns = {
            Leads: ['Full_Name', 'Email', 'Company', 'Phone', 'Lead_Source', 'Lead_Status', 'Owner'],
            Deals: ['Deal_Name', 'Amount', 'Stage', 'Closing_Date', 'Account_Name', 'Owner'],
            Contacts: ['Full_Name', 'Email', 'Phone', 'Account_Name', 'Mailing_City', 'Owner'],
            Tasks: ['Subject', 'Due_Date', 'Status', 'Priority', 'What_Id', 'Owner'],
            Accounts: ['Account_Name', 'Phone', 'Website', 'Industry', 'Billing_City', 'Owner']
        };

        async function checkConnection() {
            try {
                const response = await fetch('/api/integrations/status');
                const data = await response.json();
                const statusEl = document.getElementById('connectionStatus');
                
                if (data.zoho?.connected) {
                    statusEl.textContent = 'Connected';
                    statusEl.className = 'px-3 py-1 bg-green-100 text-green-800 rounded-full text-sm font-medium';
                    statusEl.title = data.zoho.message;
                } else {
                    statusEl.textContent = 'Not Connected';
                    statusEl.className = 'px-3 py-1 bg-red-100 text-red-800 rounded-full text-sm font-medium';
                }
            } catch (error) {
                console.error('Connection check failed:', error);
            }
        }

        async function fetchModuleData(module) {
            const perPage = document.getElementById('perPageSelect').value;
            const response = await fetch(`/api/crm/data?module=${module}&page=${currentPage}&per_page=${perPage}`);
            return response.json();
        }

        async function refreshData() {
            const loadingEl = document.getElementById('loadingState');
            const dataEl = document.getElementById('dataContainer');
            const errorEl = document.getElementById('errorState');
            const emptyEl = document.getElementById('emptyState');
            const refreshBtn = document.getElementById('refreshBtn');
            
            loadingEl.classList.remove('hidden');
            dataEl.classList.add('hidden');
            errorEl.classList.add('hidden');
            emptyEl.classList.add('hidden');
            refreshBtn.disabled = true;
            
            try {
                const data = await fetchModuleData(currentModule);
                
                if (!data.success) {
                    throw new Error(data.error || 'Failed to fetch data');
                }
                
                allRecords = data.records || [];
                document.getElementById('recordCount').textContent = `${allRecords.length} records`;
                document.getElementById('lastUpdated').textContent = `Updated: ${new Date().toLocaleTimeString()}`;
                
                renderTable();
                updatePagination(data);
                
                loadingEl.classList.add('hidden');
                
                if (allRecords.length === 0) {
                    emptyEl.classList.remove('hidden');
                } else {
                    dataEl.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                loadingEl.classList.add('hidden');
                errorEl.classList.remove('hidden');
                document.getElementById('errorMessage').textContent = error.message;
            } finally {
                refreshBtn.disabled = false;
            }
        }

        function renderTable() {
            const columns = moduleColumns[currentModule] || ['id'];
            const headerRow = document.getElementById('tableHeader');
            const tbody = document.getElementById('tableBody');
            
            headerRow.innerHTML = columns.map(col => 
                `<th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">${formatColumnName(col)}</th>`
            ).join('');
            
            tbody.innerHTML = allRecords.map(record => {
                const cells = columns.map(col => {
                    let value = getNestedValue(record, col);
                    if (col === 'Owner' && typeof value === 'object') {
                        value = value?.name || value?.id || '-';
                    }
                    if (col === 'Account_Name' && typeof value === 'object') {
                        value = value?.name || value?.id || '-';
                    }
                    if (col === 'What_Id' && typeof value === 'object') {
                        value = value?.name || value?.id || '-';
                    }
                    if (col === 'Amount' && value) {
                        value = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(value);
                    }
                    if ((col === 'Due_Date' || col === 'Closing_Date') && value) {
                        value = new Date(value).toLocaleDateString();
                    }
                    return `<td class="px-4 py-3 text-sm text-gray-900 whitespace-nowrap">${value || '-'}</td>`;
                }).join('');
                return `<tr class="hover:bg-gray-50">${cells}</tr>`;
            }).join('');
        }

        function getNestedValue(obj, key) {
            return obj[key];
        }

        function formatColumnName(col) {
            return col.replace(/_/g, ' ').replace(/([A-Z])/g, ' $1').trim();
        }

        function switchModule(module) {
            currentModule = module;
            currentPage = 1;
            
            document.querySelectorAll('#moduleTabs button').forEach(btn => {
                btn.classList.remove('tab-active');
                if (btn.dataset.module === module) {
                    btn.classList.add('tab-active');
                }
            });
            
            refreshData();
        }

        function filterTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchTerm) ? '' : 'none';
            });
        }

        function updatePagination(data) {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const pageInfo = document.getElementById('pageInfo');
            
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = data.count < parseInt(document.getElementById('perPageSelect').value);
            pageInfo.textContent = `Page ${currentPage}`;
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                refreshData();
            }
        }

        function nextPage() {
            currentPage++;
            refreshData();
        }

        async function loadModuleStats() {
            const modules = ['Leads', 'Deals', 'Contacts', 'Tasks', 'Accounts'];
            
            for (const module of modules) {
                try {
                    const response = await fetch(`/api/crm/data?module=${module}&per_page=1`);
                    const data = await response.json();
                    const countEl = document.getElementById(`${module.toLowerCase()}Count`);
                    if (countEl && data.success) {
                        countEl.textContent = data.count || 0;
                    }
                } catch (error) {
                    console.error(`Error fetching ${module} count:`, error);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkConnection();
            refreshData();
            loadModuleStats();
        });
    </script>
</body>
</html>
