<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Engine - WalaPlus Enterprise</title>
    <link rel="stylesheet" href="/dashboard/tailwind.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .status-green { background-color: #047857; }
        .status-amber { background-color: #D97706; }
        .status-red { background-color: #B91C1C; }
        .status-no_data { background-color: #6B7280; }
        .owner-quality_manager { border-inline-start: 4px solid #1E3A8A; }
        .owner-grc_manager { border-inline-start: 4px solid #1E293B; }
        .owner-governance_officer { border-inline-start: 4px solid #0891B2; }
        .owner-shared { border-inline-start: 4px solid #6D28D9; }
        .trend-improving::after { content: '↑'; color: #047857; margin-inline-start: 4px; }
        .trend-declining::after { content: '↓'; color: #B91C1C; margin-inline-start: 4px; }
        .trend-stable::after { content: '→'; color: #6B7280; margin-inline-start: 4px; }
    </style>
    <link rel="stylesheet" href="/css/navigation.css">
    <link rel="stylesheet" href="/css/utilities.css">
    <script src="/js/csp-styles.js?v=1"></script>
    <script src="/js/i18n.js?v=1.1"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="walaplus-nav"></div>
    <script src="/js/a11y.js" defer></script>
    <script src="/js/safe-actions.js?v=2"></script>
        <script src="/js/navigation.js?v=5.2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            WalaPlusNav.init('kpis');
        });
    </script>

    <div class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900" data-i18n="kpis.title">KPI Engine</h1>
                <p class="text-gray-600" data-i18n="kpis.subtitle">Role-based KPI tracking with automated calculations</p>
                <span id="lastCalcTimestamp" class="text-xs text-gray-400"></span>
            </div>
            <div class="flex gap-2">
                <select id="ownerFilter" class="border rounded px-3 py-2 text-sm" data-on-change="loadKPIs">
                    <option value="" data-i18n="kpis.all_owners">All Owners</option>
                    <option value="quality_manager" data-i18n="kpis.o_quality_manager">Sara (Quality Manager)</option>
                    <option value="grc_manager" data-i18n="kpis.o_grc_manager">Maram (GRC Manager)</option>
                    <option value="governance_officer" data-i18n="kpis.o_governance_officer">Mohammed (Governance Officer)</option>
                    <option value="shared" data-i18n="kpis.o_shared_kpis">Shared KPIs</option>
                </select>
                <select id="statusFilter" class="border rounded px-3 py-2 text-sm" data-on-change="loadKPIs" data-testid="select-status-filter">
                    <option value="" data-i18n="common.all_statuses">All Statuses</option>
                    <option value="green" data-i18n="kpis.s_on_target">On Target</option>
                    <option value="yellow" data-i18n="kpis.s_at_risk">At Risk</option>
                    <option value="red" data-i18n="kpis.s_below_target">Below Target</option>
                </select>
                <button data-on-click="navigateTo" data-args="[&quot;/api/kpis/export-xlsx&quot;]" class="border border-emerald-700 text-emerald-700 px-3 py-2 rounded text-sm hover:bg-emerald-50 flex items-center gap-1" data-testid="button-export-xlsx" title="Multi-sheet workbook by category">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    Excel
                </button>
                <button data-on-click="navigateTo" data-args="[&quot;/api/kpis/export&quot;]" class="border border-blue-600 text-blue-600 px-3 py-2 rounded text-sm hover:bg-blue-50 flex items-center gap-1" data-testid="button-export-csv">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    CSV
                </button>
                <button data-on-click="openAddModal" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">+ Add KPI</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-xl shadow p-4">
                <div class="text-3xl font-bold text-gray-900" id="totalKPIs">0</div>
                <div class="text-sm text-gray-600" data-i18n="kpis.total_kpis">Total KPIs</div>
            </div>
            <div class="bg-white rounded-xl shadow p-4">
                <div class="text-3xl font-bold text-green-700" id="greenCount">0</div>
                <div class="text-sm text-gray-600" data-i18n="kpis.on_target">On Target</div>
            </div>
            <div class="bg-white rounded-xl shadow p-4">
                <div class="text-3xl font-bold text-amber-600" id="amberCount">0</div>
                <div class="text-sm text-gray-600" data-i18n="kpis.at_risk">At Risk</div>
            </div>
            <div class="bg-white rounded-xl shadow p-4">
                <div class="text-3xl font-bold text-red-700" id="redCount">0</div>
                <div class="text-sm text-gray-600" data-i18n="kpis.off_target">Off Target</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
            <div class="bg-white rounded-xl shadow p-4">
                <h3 class="font-semibold text-gray-900 mb-3" data-i18n="kpis.kpis_by_owner">KPIs by Owner</h3>
                <figure>
                    <canvas id="ownerChart" height="200" role="img" aria-label="KPIs by Owner: doughnut chart showing KPI distribution across owners" aria-describedby="ownerChart-summary"></canvas>
                    <table id="ownerChart-summary" class="sr-only"><caption>KPIs by Owner</caption><thead><tr><th scope="col">Category</th><th scope="col">Value</th></tr></thead><tbody></tbody></table>
                </figure>
            </div>
            <div class="bg-white rounded-xl shadow p-4">
                <h3 class="font-semibold text-gray-900 mb-3" data-i18n="kpis.status_distribution">Status Distribution</h3>
                <figure>
                    <canvas id="statusChart" height="200" role="img" aria-label="KPI Status Distribution: doughnut chart showing on-target, at-risk, off-target, and no-data counts" aria-describedby="statusChart-summary"></canvas>
                    <table id="statusChart-summary" class="sr-only"><caption>KPI Status Distribution</caption><thead><tr><th scope="col">Category</th><th scope="col">Value</th></tr></thead><tbody></tbody></table>
                </figure>
            </div>
            <div class="bg-white rounded-xl shadow p-4">
                <h3 class="font-semibold text-gray-900 mb-3" data-i18n="kpis.kpis_by_category">KPIs by Category</h3>
                <figure>
                    <canvas id="categoryChart" height="200" role="img" aria-label="KPIs by Category: bar chart showing KPI count per governance category" aria-describedby="categoryChart-summary"></canvas>
                    <table id="categoryChart-summary" class="sr-only"><caption>KPIs by Category</caption><thead><tr><th scope="col">Category</th><th scope="col">Value</th></tr></thead><tbody></tbody></table>
                </figure>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow">
            <div class="p-4 border-b flex justify-between items-center">
                <h2 class="font-semibold text-gray-900" data-i18n="kpis.kpi_catalog">KPI Catalog</h2>
                <div class="flex gap-2">
                    <input type="text" id="searchInput" placeholder="Search KPIs..." class="border rounded px-3 py-1 text-sm" data-on-input="filterKPIs">
                </div>
            </div>
            <div id="kpiList" class="divide-y">
            </div>
        </div>
    </div>

    <div id="kpiModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="font-semibold text-gray-900" id="modalTitle">Add KPI</h3>
                <button data-on-click="closeModal" class="text-gray-400 hover:text-gray-600">&times;</button>
            </div>
            <form id="kpiForm" class="p-4 space-y-4">
                <input type="hidden" id="kpiId">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="kpis.f_kpi_name">KPI Name</label>
                        <input type="text" id="kpiName" required class="w-full border rounded px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="kpis.f_kpi_code">KPI Code</label>
                        <input type="text" id="kpiCode" required class="w-full border rounded px-3 py-2" placeholder="e.g., QM-GOV-002">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="kpis.f_description">Description</label>
                    <textarea id="kpiDescription" rows="2" class="w-full border rounded px-3 py-2"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="kpis.f_owner">Owner</label>
                        <select id="kpiOwnerType" required class="w-full border rounded px-3 py-2">
                            <option value="quality_manager" data-i18n="kpis.o_quality_manager">Sara (Quality Manager)</option>
                            <option value="grc_manager" data-i18n="kpis.o_grc_manager">Maram (GRC Manager)</option>
                            <option value="governance_officer" data-i18n="kpis.o_governance_officer">Mohammed (Governance Officer)</option>
                            <option value="shared" data-i18n="kpis.o_shared">Shared</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="kpis.f_category">Category</label>
                        <select id="kpiCategory" required class="w-full border rounded px-3 py-2">
                            <option value="governance" data-i18n="kpis.c_governance">Governance</option>
                            <option value="risk" data-i18n="kpis.c_risk">Risk</option>
                            <option value="compliance" data-i18n="kpis.c_compliance">Compliance</option>
                            <option value="audit" data-i18n="kpis.c_audit">Audit</option>
                            <option value="quality" data-i18n="kpis.c_quality">Quality</option>
                            <option value="vendor" data-i18n="kpis.c_vendor">Vendor</option>
                            <option value="training" data-i18n="kpis.c_training">Training</option>
                            <option value="ai" data-i18n="kpis.c_ai">AI</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="kpis.f_formula">Formula</label>
                    <input type="text" id="kpiFormula" class="w-full border rounded px-3 py-2" placeholder="e.g., (Completed / Total) × 100">
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="kpis.f_unit">Unit</label>
                        <input type="text" id="kpiUnit" class="w-full border rounded px-3 py-2" value="%">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="kpis.f_frequency">Frequency</label>
                        <select id="kpiFrequency" class="w-full border rounded px-3 py-2">
                            <option value="daily" data-i18n="kpis.fr_daily">Daily</option>
                            <option value="weekly" data-i18n="kpis.fr_weekly">Weekly</option>
                            <option value="monthly" selected data-i18n="kpis.fr_monthly">Monthly</option>
                            <option value="quarterly" data-i18n="kpis.fr_quarterly">Quarterly</option>
                            <option value="annual" data-i18n="kpis.fr_annual">Annual</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="kpis.f_target">Target</label>
                        <input type="number" id="kpiTarget" class="w-full border rounded px-3 py-2" step="0.01">
                    </div>
                </div>
                <div class="grid grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-green-700 mb-1">Green ≥</label>
                        <input type="number" id="thresholdGreen" required class="w-full border rounded px-3 py-2" step="0.01">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-amber-600 mb-1">Amber ≥</label>
                        <input type="number" id="thresholdAmber" required class="w-full border rounded px-3 py-2" step="0.01">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-red-700 mb-1">Red Below</label>
                        <input type="number" id="thresholdRed" required class="w-full border rounded px-3 py-2" step="0.01">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="kpis.f_direction">Direction</label>
                        <select id="thresholdDirection" class="w-full border rounded px-3 py-2">
                            <option value="higher_is_better" data-i18n="kpis.d_higher">Higher is Better</option>
                            <option value="lower_is_better" data-i18n="kpis.d_lower">Lower is Better</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-4">
                    <button type="button" data-on-click="closeModal" class="px-4 py-2 border rounded text-gray-600 hover:bg-gray-50">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save KPI</button>
                </div>
            </form>
        </div>
    </div>

    <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-xl max-w-3xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="font-semibold text-gray-900" id="detailTitle">KPI Details</h3>
                <button data-on-click="closeDetailModal" class="text-gray-400 hover:text-gray-600">&times;</button>
            </div>
            <div id="detailContent" class="p-4">
            </div>
        </div>
    </div>

    <script>
        let allKPIs = [];

        function _kpiCategoryLabel(cat, fb) {
            switch (cat) {
                case 'governance': return WalaPlusI18n.t('kpis.c_governance', fb);
                case 'risk':       return WalaPlusI18n.t('kpis.c_risk', fb);
                case 'compliance': return WalaPlusI18n.t('kpis.c_compliance', fb);
                case 'audit':      return WalaPlusI18n.t('kpis.c_audit', fb);
                case 'quality':    return WalaPlusI18n.t('kpis.c_quality', fb);
                case 'vendor':     return WalaPlusI18n.t('kpis.c_vendor', fb);
                case 'training':   return WalaPlusI18n.t('kpis.c_training', fb);
                case 'ai':         return WalaPlusI18n.t('kpis.c_ai', fb);
            }
            return fb;
        }
        function _kpiOwnerLabel(owner) {
            switch (owner) {
                case 'quality_manager':    return WalaPlusI18n.t('dyn.kpis.owners.quality_manager');
                case 'grc_manager':        return WalaPlusI18n.t('dyn.kpis.owners.grc_manager');
                case 'governance_officer': return WalaPlusI18n.t('dyn.kpis.owners.governance_officer');
                case 'shared':             return WalaPlusI18n.t('dyn.kpis.owners.shared');
            }
            return owner;
        }
        function _kpiOwnerFullLabel(owner) {
            switch (owner) {
                case 'quality_manager':    return WalaPlusI18n.t('dyn.kpis.owners_full.quality_manager');
                case 'grc_manager':        return WalaPlusI18n.t('dyn.kpis.owners_full.grc_manager');
                case 'governance_officer': return WalaPlusI18n.t('dyn.kpis.owners_full.governance_officer');
                case 'shared':             return WalaPlusI18n.t('dyn.kpis.owners_full.shared');
            }
            return owner;
        }
        const _fd = (d, opts) => window.WalaPlusI18n ? WalaPlusI18n.formatDate(d, opts) : (d ? new Date(d).toLocaleDateString() : '-');
        const _fn = (n) => window.WalaPlusI18n ? WalaPlusI18n.formatNumber(n) : String(n);
        function _runWhenI18nReady(fn) { if (window.WalaPlusI18n && typeof WalaPlusI18n.onReady === 'function') WalaPlusI18n.onReady(fn); else fn(); }
        let charts = {};

        async function loadKPIs() {
            const owner = document.getElementById('ownerFilter').value;
            const statusFilter = document.getElementById('statusFilter')?.value || '';
            const url = owner ? `/api/kpis?owner=${owner}` : '/api/kpis/summary';
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                
                if (owner) {
                    allKPIs = data;
                } else {
                    allKPIs = data.kpiDetails || [];
                }

                let filtered = allKPIs;
                if (statusFilter) {
                    filtered = allKPIs.filter(k => k.status === statusFilter);
                }

                renderKPIList(filtered);

                if (!owner) {
                    updateStats(data);
                    window._lastKPIChartData = data;
                    renderCharts(data);
                } else {
                    updateStats({ kpiDetails: allKPIs.map(k => ({ ...k, status: 'no_data' })) });
                }

                const tsEl = document.getElementById('lastCalcTimestamp');
                if (tsEl) tsEl.textContent = 'Last calculated: ' + new Date().toLocaleString();
            } catch (error) {
                console.error('Error loading KPIs:', error);
            }
        }

        function updateStats(data) {
            document.getElementById('totalKPIs').textContent = _fn(data.total || allKPIs.length);
            document.getElementById('greenCount').textContent = _fn(data.byStatus?.green || 0);
            document.getElementById('amberCount').textContent = _fn(data.byStatus?.amber || 0);
            document.getElementById('redCount').textContent = _fn(data.byStatus?.red || 0);
        }

        function renderCharts(data) {
            if (charts.owner) charts.owner.destroy();
            if (charts.status) charts.status.destroy();
            if (charts.category) charts.category.destroy();

            charts.owner = new Chart(document.getElementById('ownerChart'), {
                type: 'doughnut',
                data: {
                    labels: [
                        WalaPlusI18n.t('kpis.o_quality_manager', 'Sara (Quality)'),
                        WalaPlusI18n.t('kpis.o_grc_manager', 'Maram (GRC)'),
                        WalaPlusI18n.t('kpis.o_governance_officer', 'Mohammed (Governance)'),
                        WalaPlusI18n.t('kpis.o_shared', 'Shared')
                    ],
                    datasets: [{
                        data: [data.byOwner?.quality_manager || 0, data.byOwner?.grc_manager || 0, data.byOwner?.governance_officer || 0, data.byOwner?.shared || 0],
                        backgroundColor: ['#1E3A8A', '#1E293B', '#0891B2', '#6D28D9']
                    }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });
            if (window.WalaPlusA11y) window.WalaPlusA11y.makeChartAccessible('ownerChart', charts.owner, 'KPIs by Owner');

            charts.status = new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: {
                    labels: [
                        WalaPlusI18n.t('kpis.on_target', 'On Target'),
                        WalaPlusI18n.t('kpis.at_risk', 'At Risk'),
                        WalaPlusI18n.t('kpis.off_target', 'Off Target'),
                        WalaPlusI18n.t('dyn.kpis.no_data_status', 'No Data')
                    ],
                    datasets: [{
                        data: [data.byStatus?.green || 0, data.byStatus?.amber || 0, data.byStatus?.red || 0, data.byStatus?.no_data || 0],
                        backgroundColor: ['#047857', '#D97706', '#B91C1C', '#6B7280']
                    }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });
            if (window.WalaPlusA11y) window.WalaPlusA11y.makeChartAccessible('statusChart', charts.status, 'KPI Status Distribution');

            const cats = Object.entries(data.byCategory || {});
            charts.category = new Chart(document.getElementById('categoryChart'), {
                type: 'bar',
                data: {
                    labels: cats.map(c => _kpiCategoryLabel(c[0], c[0].charAt(0).toUpperCase() + c[0].slice(1))),
                    datasets: [{
                        label: WalaPlusI18n.t('dyn.kpis.chart_kpis'),
                        data: cats.map(c => c[1]),
                        backgroundColor: '#4F46E5'
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
            if (window.WalaPlusA11y) window.WalaPlusA11y.makeChartAccessible('categoryChart', charts.category, 'KPIs by Category');
        }

        function renderKPIList(kpis) {
            const container = document.getElementById('kpiList');
            if (!kpis.length) {
                container.innerHTML = '<div class="p-8 text-center text-gray-500">' + WalaPlusI18n.t('dyn.kpis.no_kpis') + '</div>';
                return;
            }
            
            container.innerHTML = kpis.map(kpi => {
                const ownerLabel = _kpiOwnerLabel(kpi.owner_type || 'shared');
                const hasNavMap = kpi.navigation_map && kpi.navigation_map.length > 0;
                const statusClass = kpi.status || 'no_data';
                const trendClass = kpi.trend ? `trend-${kpi.trend}` : '';
                
                return `
                    <div class="p-4 hover:bg-gray-50 cursor-pointer owner-${kpi.owner_type}" data-on-click="showDetail" data-args="[${kpi.id}]">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <div class="flex items-center gap-2">
                                    <span class="w-3 h-3 rounded-full status-${statusClass}"></span>
                                    <span class="font-medium text-gray-900">${kpi.kpi_name}</span>
                                    <span class="text-xs text-gray-500">${kpi.kpi_code}</span>
                                </div>
                                <p class="text-sm text-gray-600 mt-1">${kpi.description || ''}</p>
                                <div class="flex items-center gap-4 mt-2 text-xs text-gray-500">
                                    <span>${WalaPlusI18n.t('dyn.kpis.owner_label', { name: ownerLabel })}</span>
                                    <span>${WalaPlusI18n.t('dyn.kpis.category_label', { name: _kpiCategoryLabel(kpi.category, kpi.category) })}</span>
                                    <span>${WalaPlusI18n.t('dyn.kpis.frequency_label', { name: kpi.frequency })}</span>
                                    ${hasNavMap ? `<span class="text-cyan-600 font-medium">📋 ${WalaPlusI18n.t('dyn.kpis.has_steps')}</span>` : ''}
                                </div>
                            </div>
                            <div class="text-end">
                                <div class="text-2xl font-bold text-gray-900 ${trendClass}">
                                    ${kpi.latestValue !== null && kpi.latestValue !== undefined ? _fn(kpi.latestValue) + (kpi.unit || '%') : '--'}
                                </div>
                                <div class="text-xs text-gray-500">${WalaPlusI18n.t('dyn.kpis.target_label', { value: (kpi.target_value !== null && kpi.target_value !== undefined ? _fn(kpi.target_value) : '--') + (kpi.unit || '%') })}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterKPIs() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allKPIs.filter(k => 
                k.kpi_name.toLowerCase().includes(search) || 
                k.kpi_code.toLowerCase().includes(search) ||
                (k.description && k.description.toLowerCase().includes(search))
            );
            renderKPIList(filtered);
        }

        async function showDetail(id) {
            try {
                const res = await fetch(`/api/kpis/${id}`);
                const kpi = await res.json();
                
                const ownerLabel = _kpiOwnerFullLabel(kpi.owner_type || 'shared');
                const navMap = kpi.navigation_map ? (typeof kpi.navigation_map === 'string' ? JSON.parse(kpi.navigation_map) : kpi.navigation_map) : null;
                const statusLabel = kpi.latestValue?.status || WalaPlusI18n.t('dyn.kpis.no_data_status');
                
                document.getElementById('detailTitle').textContent = kpi.kpi_name;
                document.getElementById('detailContent').innerHTML = `
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <h4 class="font-semibold text-gray-900 mb-3">${WalaPlusI18n.t('dyn.kpis.definition')}</h4>
                            <div class="space-y-2 text-sm">
                                <div><span class="text-gray-500">${WalaPlusI18n.t('dyn.kpis.code_label')}</span> ${kpi.kpi_code}</div>
                                <div><span class="text-gray-500">${WalaPlusI18n.t('dyn.kpis.owner_kw')}</span> ${ownerLabel}</div>
                                <div><span class="text-gray-500">${WalaPlusI18n.t('dyn.kpis.category_kw')}</span> ${kpi.category}</div>
                                <div><span class="text-gray-500">${WalaPlusI18n.t('dyn.kpis.frequency_kw')}</span> ${kpi.frequency}</div>
                                <div><span class="text-gray-500">${WalaPlusI18n.t('dyn.kpis.unit_kw')}</span> ${kpi.unit}</div>
                            </div>
                            <div class="mt-4">
                                <span class="text-gray-500 text-sm">${WalaPlusI18n.t('dyn.kpis.description_kw')}</span>
                                <p class="text-sm text-gray-700 mt-1">${kpi.description || WalaPlusI18n.t('dyn.kpis.no_description')}</p>
                            </div>
                            <div class="mt-4">
                                <span class="text-gray-500 text-sm">${WalaPlusI18n.t('dyn.kpis.formula_kw')}</span>
                                <p class="text-sm text-gray-700 mt-1 font-mono bg-gray-50 p-2 rounded">${kpi.formula || WalaPlusI18n.t('dyn.kpis.not_specified')}</p>
                            </div>
                        </div>
                        <div>
                            <h4 class="font-semibold text-gray-900 mb-3">${WalaPlusI18n.t('dyn.kpis.thresholds')}</h4>
                            <div class="space-y-2">
                                <div class="flex items-center justify-between p-2 bg-green-50 rounded">
                                    <span class="text-green-700">${WalaPlusI18n.t('dyn.kpis.green_on_target')}</span>
                                    <span class="font-medium">${kpi.threshold_direction === 'higher_is_better' ? '≥' : '≤'} ${_fn(kpi.threshold_green)}${kpi.unit}</span>
                                </div>
                                <div class="flex items-center justify-between p-2 bg-amber-50 rounded">
                                    <span class="text-amber-700">${WalaPlusI18n.t('dyn.kpis.amber_at_risk')}</span>
                                    <span class="font-medium">${kpi.threshold_direction === 'higher_is_better' ? '≥' : '≤'} ${_fn(kpi.threshold_amber)}${kpi.unit}</span>
                                </div>
                                <div class="flex items-center justify-between p-2 bg-red-50 rounded">
                                    <span class="text-red-700">${WalaPlusI18n.t('dyn.kpis.red_off_target')}</span>
                                    <span class="font-medium">${kpi.threshold_direction === 'higher_is_better' ? '<' : '>'} ${_fn(kpi.threshold_red)}${kpi.unit}</span>
                                </div>
                            </div>
                            <div class="mt-4">
                                <span class="text-gray-500 text-sm">${WalaPlusI18n.t('dyn.kpis.target_value')}</span>
                                <p class="text-2xl font-bold text-blue-800">${kpi.target_value !== null && kpi.target_value !== undefined ? _fn(kpi.target_value) : '--'}${kpi.unit}</p>
                            </div>
                        </div>
                    </div>
                    ${navMap && navMap.length > 0 ? `
                    <div class="mt-6">
                        <h4 class="font-semibold text-gray-900 mb-3 flex items-center">
                            <span class="w-6 h-6 bg-cyan-100 text-cyan-600 rounded me-2 flex items-center justify-center text-sm">📋</span>
                            ${WalaPlusI18n.t('dyn.kpis.nav_steps')}
                        </h4>
                        <div class="space-y-3">
                            ${navMap.map(step => `
                                <div class="border-s-4 border-cyan-500 bg-gray-50 rounded-e-lg p-3">
                                    <div class="flex items-start gap-3">
                                        <div class="w-7 h-7 rounded-full bg-cyan-600 text-white flex items-center justify-center text-sm font-bold flex-shrink-0">${_fn(step.step)}</div>
                                        <div class="flex-1">
                                            <div class="font-medium text-gray-900">${step.action}</div>
                                            <div class="text-sm text-gray-600 mt-1">
                                                <span class="text-gray-500">${WalaPlusI18n.t('dyn.kpis.screen_kw')}</span> 
                                                <a href="${step.route}" class="text-cyan-600 hover:underline">${step.screen}</a>
                                            </div>
                                            <div class="grid grid-cols-2 gap-2 mt-2 text-xs">
                                                <div class="bg-white rounded p-2">
                                                    <div class="text-gray-500 uppercase font-medium">${WalaPlusI18n.t('dyn.kpis.what_to_check')}</div>
                                                    <div class="text-gray-700">${step.what_to_check}</div>
                                                </div>
                                                <div class="bg-amber-50 rounded p-2">
                                                    <div class="text-amber-600 uppercase font-medium">${WalaPlusI18n.t('dyn.kpis.if_result')}</div>
                                                    <div class="text-gray-700">${step.if_result}</div>
                                                </div>
                                            </div>
                                            <div class="bg-green-50 rounded p-2 mt-2 text-xs">
                                                <div class="text-green-600 uppercase font-medium">${WalaPlusI18n.t('dyn.kpis.then_action')}</div>
                                                <div class="text-gray-700">${step.then_action}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                    <div class="mt-6">
                        <h4 class="font-semibold text-gray-900 mb-3">${WalaPlusI18n.t('dyn.kpis.history_title')}</h4>
                        ${kpi.history && kpi.history.length ? `
                            <figure>
                                <canvas id="historyChart" height="120" role="img" aria-label="KPI value history: line chart comparing actual values to target over time" aria-describedby="historyChart-summary"></canvas>
                                <table id="historyChart-summary" class="sr-only"><caption>KPI Value History</caption><thead><tr><th scope="col">Category</th><th scope="col">Value</th></tr></thead><tbody></tbody></table>
                            </figure>
                        ` : '<p class="text-gray-500 text-sm">' + WalaPlusI18n.t('dyn.kpis.no_history') + '</p>'}
                    </div>
                    <div class="mt-6 flex justify-end gap-2">
                        <button data-on-click="openRecordValueModal" data-args="[${kpi.id}]" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 text-sm">${WalaPlusI18n.t('dyn.kpis.record_value_btn')}</button>
                        <button data-on-click="editKPI" data-args="[${kpi.id}]" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm">${WalaPlusI18n.t('dyn.kpis.edit_kpi_btn')}</button>
                    </div>
                `;
                
                document.getElementById('detailModal').classList.remove('hidden');
                
                if (kpi.history && kpi.history.length) {
                    setTimeout(() => {
                        const ctx = document.getElementById('historyChart');
                        if (ctx) {
                            const histChart = new Chart(ctx, {
                                type: 'line',
                                data: {
                                    labels: kpi.history.reverse().map(h => _fd(h.period_end)),
                                    datasets: [{
                                        label: WalaPlusI18n.t('dyn.kpis.chart_actual'),
                                        data: kpi.history.map(h => h.actual_value),
                                        borderColor: '#1E3A8A',
                                        tension: 0.3
                                    }, {
                                        label: WalaPlusI18n.t('dyn.kpis.chart_target'),
                                        data: kpi.history.map(() => kpi.target_value),
                                        borderColor: '#9CA3AF',
                                        borderDash: [5, 5]
                                    }]
                                },
                                options: { responsive: true }
                            });
                            if (window.WalaPlusA11y) window.WalaPlusA11y.makeChartAccessible('historyChart', histChart, 'KPI Value History');
                        }
                    }, 100);
                }
            } catch (error) {
                console.error('Error loading KPI details:', error);
            }
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = WalaPlusI18n.t('dyn.kpis.modal_add');
            document.getElementById('kpiForm').reset();
            document.getElementById('kpiId').value = '';
            document.getElementById('kpiModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('kpiModal').classList.add('hidden');
        }

        async function editKPI(id) {
            closeDetailModal();
            try {
                const res = await fetch(`/api/kpis/${id}`);
                const kpi = await res.json();
                
                document.getElementById('modalTitle').textContent = WalaPlusI18n.t('dyn.kpis.modal_edit');
                document.getElementById('kpiId').value = kpi.id;
                document.getElementById('kpiName').value = kpi.kpi_name;
                document.getElementById('kpiCode').value = kpi.kpi_code;
                document.getElementById('kpiDescription').value = kpi.description || '';
                document.getElementById('kpiOwnerType').value = kpi.owner_type;
                document.getElementById('kpiCategory').value = kpi.category;
                document.getElementById('kpiFormula').value = kpi.formula || '';
                document.getElementById('kpiUnit').value = kpi.unit || '%';
                document.getElementById('kpiFrequency').value = kpi.frequency;
                document.getElementById('kpiTarget').value = kpi.target_value || '';
                document.getElementById('thresholdGreen').value = kpi.threshold_green;
                document.getElementById('thresholdAmber').value = kpi.threshold_amber;
                document.getElementById('thresholdRed').value = kpi.threshold_red;
                document.getElementById('thresholdDirection').value = kpi.threshold_direction;
                
                document.getElementById('kpiModal').classList.remove('hidden');
            } catch (error) {
                console.error('Error loading KPI for edit:', error);
            }
        }

        document.getElementById('kpiForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('kpiId').value;
            const payload = {
                kpi_name: document.getElementById('kpiName').value,
                kpi_code: document.getElementById('kpiCode').value,
                description: document.getElementById('kpiDescription').value,
                owner_type: document.getElementById('kpiOwnerType').value,
                category: document.getElementById('kpiCategory').value,
                formula: document.getElementById('kpiFormula').value,
                unit: document.getElementById('kpiUnit').value,
                frequency: document.getElementById('kpiFrequency').value,
                target_value: parseFloat(document.getElementById('kpiTarget').value) || null,
                threshold_green: parseFloat(document.getElementById('thresholdGreen').value),
                threshold_amber: parseFloat(document.getElementById('thresholdAmber').value),
                threshold_red: parseFloat(document.getElementById('thresholdRed').value),
                threshold_direction: document.getElementById('thresholdDirection').value,
                is_active: true
            };
            
            try {
                const method = id ? 'PUT' : 'POST';
                const url = id ? `/api/kpis/${id}` : '/api/kpis';
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    closeModal();
                    loadKPIs();
                } else {
                    alert(WalaPlusI18n.t('dyn.kpis.failed_save'));
                }
            } catch (error) {
                console.error('Error saving KPI:', error);
                alert(WalaPlusI18n.t('dyn.kpis.error_save'));
            }
        });

        function openRecordValueModal(kpiId) {
            const value = prompt(WalaPlusI18n.t('dyn.kpis.prompt_value'));
            if (value !== null) {
                recordValue(kpiId, parseFloat(value));
            }
        }

        async function recordValue(kpiId, value) {
            const now = new Date();
            const periodStart = new Date(now.getFullYear(), now.getMonth(), 1);
            const periodEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            
            try {
                const res = await fetch(`/api/kpis/${kpiId}/values`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        actual_value: value,
                        period_start: periodStart.toISOString().split('T')[0],
                        period_end: periodEnd.toISOString().split('T')[0]
                    })
                });
                
                if (res.ok) {
                    closeDetailModal();
                    loadKPIs();
                } else {
                    alert(WalaPlusI18n.t('dyn.kpis.failed_record_value'));
                }
            } catch (error) {
                console.error('Error recording value:', error);
            }
        }

        _runWhenI18nReady(loadKPIs);

        // Re-render the catalog list and rebuild Chart.js doughnuts/bars when
        // the operator switches language so localized labels appear without
        // waiting on the page reload that follows. Safe even when the reload
        // is fast — destroy() guards against duplicate canvases.
        document.addEventListener('walaPlusLanguageChange', function () {
            try {
                const statusFilter = document.getElementById('statusFilter')?.value || '';
                let filtered = allKPIs;
                if (statusFilter) filtered = allKPIs.filter(k => k.status === statusFilter);
                renderKPIList(filtered);
                if (window._lastKPIChartData) renderCharts(window._lastKPIChartData);
            } catch (_) {}
        });
    </script>
    <script src="/js/ai-consultant-widget.js?v=4.5.2"></script>
    <script>
        if (window.WalaPlusI18n) {
            window.WalaPlusI18n.init().then(function () { window.WalaPlusI18n.applyToDOM(); });
        }
    </script>
</body>
</html>
