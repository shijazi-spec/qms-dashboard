<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>North Star KPI — Data Entry</title>
  <link rel="stylesheet" href="/dashboard/tailwind.css" />
    <link rel="stylesheet" href="/css/theme.css">
    <script id="walaplus-theme-fouc-init">
        (function () {
            try {
                var v = localStorage.getItem('walaplus_theme');
                if (v === 'dark') {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.add('wp-dark');
                }
            } catch (e) { /* private-mode / blocked storage — light default is fine */ }
        })();
    </script>
  <link rel="stylesheet" href="/css/utilities.css" />
  <style>
    label { font-size: .8rem; color:#374151; font-weight:600; }
    input, select { width:100%; border:1px solid #d1d5db; border-radius:.5rem; padding:.45rem .6rem; font-size:.9rem; }
    .field { margin-bottom:.75rem; }
  </style>
  <script src="/js/i18n.js?v=1.0"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="walaplus-nav"></div>
  <script src="/js/navigation.js"></script>
  <script>try { WalaPlusNav.init('leadership-kpis'); } catch (e) {}</script>

  <div class="max-w-5xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-1">
      <h1 class="text-2xl font-bold text-blue-900">North Star KPI — Data Entry</h1>
      <a href="/leadership-kpis" class="text-cyan-600 text-sm underline">← back to KPI results</a>
    </div>
    <p class="text-gray-500 mb-6">Enter the records that feed the 5 KPIs without an existing QMS source. Saving recomputes that KPI on the next feed/refresh.</p>

    <div class="field max-w-md">
      <label>KPI / dataset</label>
      <select id="source"></select>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
      <div class="bg-white rounded-xl shadow p-5">
        <h2 id="formTitle" class="font-semibold text-gray-800 mb-3"></h2>
        <form id="entryForm"></form>
        <button id="saveBtn" class="mt-2 px-4 py-2 bg-cyan-600 text-white rounded-lg hover:bg-cyan-700 text-sm">Save record</button>
        <span id="msg" class="ms-3 text-sm"></span>
      </div>
      <div class="bg-white rounded-xl shadow p-5">
        <h2 class="font-semibold text-gray-800 mb-3">Recent entries</h2>
        <div id="recent" class="text-sm text-gray-600 overflow-auto max-h-420"></div>
      </div>
    </div>
  </div>

  <script>
    const BU = ["SDR","Sales","Marketplace","Customer Success","WalaOne","Marketing","HR","Finance","IT","Software","Customer Support","GRC","Quality"];
    // schema: field -> {type, label, options?}
    const SOURCES = {
      certification_milestones: { title: "Certification Milestone Delivery (GRC-KPI-002)", fields: {
        certification: { type:"text", label:"Certification (ISO 27001 / PDPL / PCI / NCA)" },
        milestone_name: { type:"text", label:"Milestone name" },
        planned_date: { type:"date", label:"Planned date" },
        delivered_date: { type:"date", label:"Delivered date (blank if not yet)" },
        status: { type:"select", label:"Status", options:["planned","delivered","delayed","cancelled"] },
        owner: { type:"text", label:"Owner" },
        notes: { type:"text", label:"Notes" },
      }},
      evidence_requests: { title: "Evidence SLA Compliance (GRC-KPI-004)", fields: {
        request_ref: { type:"text", label:"Request reference" },
        business_unit: { type:"select", label:"Business unit", options:BU },
        requested_date: { type:"date", label:"Requested date" },
        sla_due_date: { type:"date", label:"SLA due date" },
        delivered_date: { type:"date", label:"Delivered date (blank if not yet)" },
        status: { type:"select", label:"Status", options:["open","delivered","late","cancelled"] },
        owner: { type:"text", label:"Owner" },
      }},
      tpra_requests: { title: "TPRA Vendor Risk SLA (GRC-KPI-006)", fields: {
        vendor_name: { type:"text", label:"Vendor name" },
        requested_date: { type:"date", label:"Requested date" },
        sla_due_date: { type:"date", label:"SLA due date" },
        completed_date: { type:"date", label:"Completed date (blank if not yet)" },
        status: { type:"select", label:"Status", options:["open","completed","late","cancelled"] },
        owner: { type:"text", label:"Owner" },
      }},
      qms_adoption: { title: "QMS Adoption Rate (QM-KPI-004)", fields: {
        business_unit: { type:"select", label:"Business unit", options:BU },
        status: { type:"select", label:"Adoption status", options:["not_started","in_progress","adopted"] },
        adoption_date: { type:"date", label:"Adoption date" },
        notes: { type:"text", label:"Notes" },
      }},
      value_realization: { title: "Op. Excellence Value Realization (QM-KPI-007)", fields: {
        initiative_name: { type:"text", label:"Initiative name" },
        category: { type:"text", label:"Category" },
        target_value: { type:"number", label:"Target value" },
        realized_value: { type:"number", label:"Realized value" },
        period: { type:"text", label:"Period (e.g. 2026-Q2)" },
        status: { type:"select", label:"Status", options:["in_progress","realized","cancelled"] },
        notes: { type:"text", label:"Notes" },
      }},
      okr_metric_entries: { title: "OKR Capture Metrics — Phase 2 (by code)", fields: {
        metric_code: { type:"select", label:"Metric code (see OKRs page)", options:["QM-KPI-010","QM-KPI-011","QM-KPI-012","QM-KPI-013","QM-KPI-014","GRC-KPI-012","GRC-KPI-014","GRC-KPI-015"] },
        period: { type:"text", label:"Period (e.g. 2026-Q2)" },
        numerator: { type:"number", label:"Numerator — for ratio metrics (e.g. on-time count)" },
        denominator: { type:"number", label:"Denominator — for ratio metrics (e.g. total)" },
        baseline: { type:"number", label:"Baseline — for reduction metrics" },
        current_val: { type:"number", label:"Current — for reduction metrics" },
        avg_days: { type:"number", label:"Avg days — for time metrics" },
        note: { type:"text", label:"Note" },
      }},
    };
    const esc = (s) => String(s==null?"":s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    const sel = document.getElementById("source");
    Object.keys(SOURCES).forEach((k) => { const o=document.createElement("option"); o.value=k; o.textContent=SOURCES[k].title; sel.appendChild(o); });

    function renderForm() {
      const s = SOURCES[sel.value];
      document.getElementById("formTitle").textContent = s.title;
      document.getElementById("entryForm").innerHTML = Object.entries(s.fields).map(([f, d]) => {
        const ctrl = d.type === "select"
          ? `<select name="${f}"><option value=""></option>${d.options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join("")}</select>`
          : `<input name="${f}" type="${d.type}" step="${d.type==='number'?'any':''}" />`;
        return `<div class="field"><label>${esc(d.label)}</label>${ctrl}</div>`;
      }).join("");
      loadRecent();
    }

    async function loadRecent() {
      const r = await fetch(`/api/northstar/${sel.value}`, { credentials:"same-origin" });
      const wrap = document.getElementById("recent");
      if (!r.ok) { wrap.innerHTML = `<span class="text-red-600">Could not load (${r.status})</span>`; return; }
      const { rows } = await r.json();
      if (!rows || !rows.length) { wrap.innerHTML = '<span class="text-gray-400">No records yet.</span>'; return; }
      const cols = Object.keys(SOURCES[sel.value].fields);
      wrap.innerHTML = `<table class="w-full text-xs"><thead><tr class="text-gray-500 text-start">${cols.map(c=>`<th scope="col" class="pe-2 pb-1">${esc(c)}</th>`).join("")}</tr></thead><tbody>${
        rows.map(row => `<tr class="border-t">${cols.map(c=>`<td class="pe-2 py-1">${esc(row[c])}</td>`).join("")}</tr>`).join("")
      }</tbody></table>`;
    }

    async function save() {
      const form = document.getElementById("entryForm");
      const body = {};
      new FormData(form).forEach((v, k) => { if (v !== "") body[k] = v; });
      const msg = document.getElementById("msg");
      msg.textContent = "Saving…"; msg.className = "ms-3 text-sm text-gray-500";
      try {
        const r = await fetch(`/api/northstar/${sel.value}`, {
          method:"POST", credentials:"same-origin",
          headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body),
        });
        if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.error || ("HTTP "+r.status)); }
        msg.textContent = "✓ Saved"; msg.className = "ms-3 text-sm text-green-600";
        form.reset(); loadRecent();
      } catch (e) {
        msg.textContent = "✗ " + e.message; msg.className = "ms-3 text-sm text-red-600";
      }
    }

    sel.addEventListener("change", renderForm);
    document.getElementById("saveBtn").addEventListener("click", save);
    renderForm();
  </script>
  <script>
    if (window.WalaPlusI18n) {
      window.WalaPlusI18n.init().then(() => window.WalaPlusI18n.applyToDOM());
    }
  </script>
</body>
</html>
