<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WalaPlus Platform Health - Infographic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0b1220; }
  #container { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="container"></div>
<script src="https://unpkg.com/@antv/infographic@latest/dist/infographic.min.js"></script>
<script>
  const syntax = `infographic list-grid-badge-card
theme dark
  palette
    - #10b981
    - #3b82f6
    - #8b5cf6
    - #f59e0b
    - #ec4899
    - #06b6d4
    - #84cc16
    - #f97316
data
  title WalaPlus Platform Health
  subtitle All Systems Operational  ·  2026-04-18 15:55 UTC
  source Pulse synthetic monitor + endpoint sweep + log scan
  lists
    - label 10 / 10
      description Pulse synthetic checks passing — DB, audits, duplicates, KPIs, HITL queue, endpoints
      icon activity heartbeat pulse
    - label 23 / 23
      description UI dashboards healthy across audits, risks, KPIs, QMS, GRC, vendors, training
      icon layout dashboard grid
    - label 8 / 8
      description Native XLSX export endpoints returning valid spreadsheets (audits, duplicates, KPIs, NC, CAPA, vendors, risks)
      icon file spreadsheet excel
    - label 4 / 4
      description Admin-gated endpoints correctly return 401 without key, 200 with key
      icon shield lock security
    - label 0
      description Errors in current log window (1 informational warning — Mastra telemetry deprecation)
      icon check circle success
    - label 66.8 K
      description CRM records synced from Zoho — 37,043 Leads + 29,796 Deals  ·  22,271 duplicate clusters detected
      icon database sync cloud
    - label 147
      description Controlled policy and SOP documents under governance  ·  260 AI consultant alerts tracked
      icon book document policy
    - label 599 MB
      description Main process memory  ·  3% CPU  ·  Healthy uptime, 0 DB connection leaks
      icon cpu server activity`;

  const infographic = new AntVInfographic.Infographic({
    container: '#container',
    width: '100%',
    height: '100%',
  });

  document.fonts?.ready.then(() => infographic.render(syntax))
    .catch(() => infographic.render(syntax));
</script>
</body>
</html>
