<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leadership KPIs — Computed by QMS</title>
  <link rel="stylesheet" href="/dashboard/tailwind.css" />
    <link rel="stylesheet" href="/css/theme.css">
    <script id="ExampleOrg-theme-fouc-init">
        (function () {
            try {
                var v = localStorage.getItem('walaplus_theme');
                if (v === 'dark') {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.add('wp-dark');
                }
            } catch (e) { /* private-mode / blocked storage — light default is fine */ }
        })();
    </script>
  <style>
    .badge { padding: 2px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .green { background:#dcfce7; color:#166534; }
    .amber { background:#fef9c3; color:#854d0e; }
    .red   { background:#fee2e2; color:#991b1b; }
    .muted { background:#f1f5f9; color:#475569; }
    .detail { display:none; }
    .detail.open { display:block; }
  </style>
  <script src="/js/i18n.js?v=1.0"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="ExampleOrg-nav"></div>
  <script src="/js/navigation.js"></script>
  <script>try { WalaPlusNav.init('leadership-kpis'); } catch (e) {}</script>

  <div class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-2">
      <h1 class="text-2xl font-bold text-blue-900">Leadership KPIs</h1>
      <div class="flex gap-2">
        <a href="/leadership-kpis/data" class="px-4 py-2 bg-white border border-cyan-600 text-cyan-700 rounded-lg hover:bg-cyan-50 text-sm">✎ Enter KPI data</a>
        <button id="refresh" class="px-4 py-2 bg-cyan-600 text-white rounded-lg hover:bg-cyan-700 text-sm">↻ Recalculate</button>
      </div>
    </div>
    <p class="text-gray-500 mb-6">Computed live by the QMS platform from real data. KPIs without data show “awaiting data”. This is the same feed the Leadership Platform pulls.</p>

    <div id="summary" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"></div>
    <div id="generated" class="text-xs text-gray-400 mb-3"></div>

    <div class="bg-white rounded-xl shadow overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-100 text-gray-600 text-start">
          <tr>
            <th scope="col" class="px-4 py-3">KPI</th>
            <th scope="col" class="px-4 py-3">Code</th>
            <th scope="col" class="px-4 py-3 text-end">Baseline → Target</th>
            <th scope="col" class="px-4 py-3 text-end">Current</th>
            <th scope="col" class="px-4 py-3 text-end">Progress</th>
            <th scope="col" class="px-4 py-3">Status</th>
            <th scope="col" class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="error" class="hidden mt-6 p-4 bg-red-50 text-red-700 rounded-lg"></div>
  </div>

  <script>
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));

    function card(label, value, cls) {
      return `<div class="bg-white rounded-lg shadow p-3 text-center">
        <div class="text-2xl font-bold ${cls}">${value}</div>
        <div class="text-xs text-gray-500">${label}</div></div>`;
    }

    function render(feed) {
      const live = new Map((feed.kpis || []).map((k) => [k.code, k]));
      const defs = feed.definitions || [];
      // Leadership status buckets
      const tally = { "On Track":0, "Exceeded":0, "Completed":0, "At Risk":0, "Off Track":0, "Behind":0, "Not Started":0 };
      const rows = defs.map((d, i) => {
        const k = live.get(d.code);
        const u = esc(d.unit || "");
        let statusHtml = '<span class="badge muted">Not Started</span>';
        let current = '<span class="text-gray-400">—</span>';
        let progress = '<span class="text-gray-300">—</span>';
        if (k) {
          const cls = k.status || "muted";
          const lbl = k.status_label || "On Track";
          if (tally[lbl] !== undefined) tally[lbl]++;
          statusHtml = `<span class="badge ${cls}">${esc(lbl)}</span>`;
          current = `<span class="font-semibold">${k.value}${u}</span>`;
          if (k.progress_pct !== null && k.progress_pct !== undefined) progress = `${k.progress_pct}%`;
        } else { tally["Not Started"]++; }
        return `<tr class="border-t">
            <td class="px-4 py-3">${esc(d.name)}</td>
            <td class="px-4 py-3 text-gray-400 font-mono text-xs">${esc(d.code)}</td>
            <td class="px-4 py-3 text-end text-gray-500">${esc(d.baseline)}${u} → ${esc(d.target)}${u}</td>
            <td class="px-4 py-3 text-end">${current}</td>
            <td class="px-4 py-3 text-end text-gray-500">${progress}</td>
            <td class="px-4 py-3">${statusHtml}</td>
            <td class="px-4 py-3 text-end"><button type="button" class="text-cyan-600 text-xs" data-toggle="det-${i}">how &amp; why ▾</button></td>
          </tr>
          <tr class="detail" id="det-${i}"><td colspan="7" class="px-4 pb-4 pt-0 bg-gray-50">
            <div class="text-gray-700"><b>What:</b> ${esc(d.description)}</div>
            <div class="text-gray-700 mt-1"><b>How calculated:</b> ${esc(d.methodology)}</div>
            <div class="text-gray-700 mt-1"><b>Why:</b> ${esc(d.rationale)}</div>
            <div class="text-gray-800 mt-1"><b>Where to update in QMS:</b> ${esc(d.entry_where)}${d.entry_route ? ` <a class="text-cyan-600 underline" href="${esc(d.entry_route)}">open ↗</a>` : ""}</div>
            <div class="text-gray-400 text-xs mt-1">${esc(d.plan_ref)}</div>
          </td></tr>`;
      }).join("");

      document.getElementById("summary").innerHTML =
        card("Total KPIs", defs.length, "text-blue-900") +
        card("On Track", tally["On Track"], "text-green-600") +
        card("Exceeded", tally["Exceeded"], "text-emerald-600") +
        card("Completed", tally["Completed"], "text-teal-600") +
        card("At Risk", tally["At Risk"], "text-yellow-600") +
        card("Off Track", tally["Off Track"], "text-red-600") +
        card("Behind", tally["Behind"], "text-rose-700") +
        card("Not Started", tally["Not Started"], "text-gray-500");
      document.getElementById("rows").innerHTML = rows;
      document.getElementById("generated").textContent = "Generated " + (feed.generated_at || "");
    }

    async function load() {
      const err = document.getElementById("error");
      err.classList.add("hidden");
      try {
        const r = await fetch("/api/kpis/leadership-feed/preview", { credentials: "same-origin" });
        if (!r.ok) throw new Error("HTTP " + r.status + (r.status === 403 ? " — needs Quality/GRC/admin role" : ""));
        render(await r.json());
      } catch (e) {
        err.textContent = "Could not load KPI results: " + e.message;
        err.classList.remove("hidden");
      }
    }
    document.getElementById("refresh").addEventListener("click", load);
    // Delegated toggle for the per-row "how & why" detail panels. The #rows
    // tbody is a stable element (only its innerHTML is replaced on render), so
    // a single listener survives re-renders — and avoids CSP-blocked inline
    // onclick handlers (script-src 'self' 'nonce-…').
    document.getElementById("rows").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-toggle]");
      if (!btn) return;
      const el = document.getElementById(btn.getAttribute("data-toggle"));
      if (el) el.classList.toggle("open");
    });
    load();
  </script>
  <script>
    if (window.WalaPlusI18n) {
      window.WalaPlusI18n.init().then(() => window.WalaPlusI18n.applyToDOM());
    }
  </script>
</body>
</html>
