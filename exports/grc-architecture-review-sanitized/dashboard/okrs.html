<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRQ OKRs — 2026</title>
  <link rel="stylesheet" href="/dashboard/tailwind.css" />
    <link rel="stylesheet" href="/css/theme.css">
    <script id="ExampleOrg-theme-fouc-init">
        (function () {
            try {
                var v = localStorage.getItem('ExampleOrg_theme');
                if (v === 'dark') {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.add('wp-dark');
                }
            } catch (e) { /* private-mode / blocked storage — light default is fine */ }
        })();
    </script>
  <style>
    .badge { padding:2px 10px; border-radius:9999px; font-size:.72rem; font-weight:600; white-space:nowrap; }
    .green { background:#dcfce7; color:#166534; }
    .amber { background:#fef9c3; color:#854d0e; }
    .red   { background:#fee2e2; color:#991b1b; }
    .muted { background:#f1f5f9; color:#475569; }
    .pending { background:#ede9fe; color:#5b21b6; }
    .detail { display:none; }
    .detail.open { display:block; }
  </style>
  <script src="/js/i18n.js?v=1.0"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="ExampleOrg-nav"></div>
  <script src="/js/navigation.js"></script>
  <script src="/js/safe-actions.js"></script>
  <script>try { ExampleOrgNav.init('okrs'); } catch (e) {}</script>

  <div class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-1">
      <h1 class="text-2xl font-bold text-blue-900">GRQ OKRs — 2026</h1>
      <button id="refresh" class="px-4 py-2 bg-cyan-600 text-white rounded-lg hover:bg-cyan-700 text-sm">↻ Refresh</button>
    </div>
    <p class="text-gray-500 mb-2">Objectives &amp; Key Results for Quality and GRC. Live values are computed by QMS; "pending" KRs don't have a calculator yet.</p>
    <div id="generated" class="text-xs text-gray-400 mb-6"></div>

    <div id="teams"></div>
    <div id="error" class="hidden mt-6 p-4 bg-red-50 text-red-700 rounded-lg"></div>
  </div>

  <script>
    const esc = (s) => String(s==null?"":s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    const TEAM = { quality: { name: "Quality — Sample User", color: "text-emerald-700" }, grc: { name: "GRC — Sample User", color: "text-indigo-700" } };

    function stateBadge(kr) {
      if (kr.state === "live") {
        const cls = kr.status || "muted";
        return `<span class="badge ${cls}">${esc(kr.current_value)}${esc(kr.current_unit||"")} · ${(kr.status||"").toUpperCase()}</span>`;
      }
      if (kr.state === "awaiting_data") return '<span class="badge muted">awaiting data</span>';
      return '<span class="badge pending">pending calculator</span>';
    }

    function krRow(kr, idx) {
      return `<tr class="border-t align-top">
        <td class="px-4 py-3">
          <div class="font-medium text-gray-800">${esc(kr.kpi_name)}</div>
          <div class="text-xs text-gray-400">${esc(kr.kr_code)}${kr.kpi_code ? " · "+esc(kr.kpi_code) : ""}</div>
        </td>
        <td class="px-4 py-3 text-gray-500">${esc(kr.target_text)}</td>
        <td class="px-4 py-3">${stateBadge(kr)}</td>
        <td class="px-4 py-3 text-gray-500 text-xs">${esc(kr.frequency)}</td>
        <td class="px-4 py-3 text-end"><button class="text-cyan-600 text-xs" data-on-click="toggleClass" data-args="[&quot;${idx}&quot;,&quot;open&quot;]">details ▾</button></td>
      </tr>
      <tr class="detail" id="${idx}"><td colspan="5" class="px-4 pb-4 pt-0 bg-gray-50 text-sm">
        <div class="text-gray-700"><b>Definition:</b> ${esc(kr.definition)}</div>
        <div class="text-gray-700 mt-1"><b>Calculation:</b> ${esc(kr.calculation)}</div>
        <div class="text-gray-400 text-xs mt-1">Data source: ${esc(kr.data_source)}</div>
      </td></tr>`;
    }

    function objCard(o, oi) {
      const rows = o.key_results.map((kr, ki) => krRow(kr, `d-${oi}-${ki}`)).join("");
      return `<div class="bg-white rounded-xl shadow mb-4 overflow-hidden">
        <div class="px-4 py-3 bg-gray-50 border-b">
          <div class="text-xs text-gray-400">${esc(o.objective_code)} · ${esc(o.owner)}</div>
          <div class="font-semibold text-gray-800">${esc(o.objective)}</div>
        </div>
        <table class="w-full text-sm">
          <thead class="text-gray-500 text-start text-xs"><tr>
            <th scope="col" class="px-4 py-2">Key Result</th><th scope="col" class="px-4 py-2">Target</th>
            <th scope="col" class="px-4 py-2">Current</th><th scope="col" class="px-4 py-2">Frequency</th><th scope="col"></th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    }

    async function load() {
      const err = document.getElementById("error"); err.classList.add("hidden");
      try {
        const r = await fetch("/api/okrs", { credentials: "same-origin" });
        if (!r.ok) throw new Error("HTTP " + r.status + (r.status===403?" — needs Quality/GRC/admin role":""));
        const { generated_at, objectives } = await r.json();
        document.getElementById("generated").textContent = "Generated " + (generated_at||"");
        const byTeam = { quality: [], grc: [] };
        objectives.forEach((o) => (byTeam[o.team] || (byTeam[o.team]=[])).push(o));
        document.getElementById("teams").innerHTML = Object.keys(byTeam).map((t) => {
          if (!byTeam[t].length) return "";
          const head = `<h2 class="text-lg font-bold mt-6 mb-3 ${TEAM[t]?TEAM[t].color:''}">${esc(TEAM[t]?TEAM[t].name:t)}</h2>`;
          return head + byTeam[t].map((o, oi) => objCard(o, t+oi)).join("");
        }).join("");
      } catch (e) {
        err.textContent = "Could not load OKRs: " + e.message; err.classList.remove("hidden");
      }
    }
    document.getElementById("refresh").addEventListener("click", load);
    load();
  </script>
  <script>
    if (window.ExampleOrgI18n) {
      window.ExampleOrgI18n.init().then(() => window.ExampleOrgI18n.applyToDOM());
    }
  </script>
</body>
</html>
