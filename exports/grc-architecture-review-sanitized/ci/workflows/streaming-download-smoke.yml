name: Streaming Download Smoke

on:
  workflow_dispatch:

concurrency:
  group: streaming-download-smoke-${{ SourceControlProvider.ref }}
  cancel-in-progress: true

jobs:
  streaming-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: development
      BASE_URL: <REDACTED_URL>
    steps:
      - name: Checkout
        uses: actions/<REDACTED_EMAIL>

      - name: Setup Node
        uses: actions/<REDACTED_EMAIL>
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gate by required secrets
        id: gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          if [ -z "${DATABASE_URL}" ] || [ -z "${SESSION_SECRET}" ]; then
            echo "run_e2e=false" >> "$SourceControlProvider_OUTPUT"
            echo "::notice::Skipping streaming smoke (DATABASE_URL/SESSION_SECRET not configured)."
          else
            echo "run_e2e=true" >> "$SourceControlProvider_OUTPUT"
          fi

      - name: Install Playwright browsers
        if: steps.gate.outputs.run_e2e == 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start dev server
        if: steps.gate.outputs.run_e2e == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          nohup npm run dev > /tmp/dev-server.log 2>&1 &

      - name: Wait for server readiness
        if: steps.gate.outputs.run_e2e == 'true'
        run: |
          for i in {1..90}; do
            if curl -fsS <REDACTED_URL> >/dev/null; then
              echo "Server is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready in time."
          sed -n '1,220p' /tmp/dev-server.log || true
          exit 1

      - name: Run streaming download Playwright smoke
        if: steps.gate.outputs.run_e2e == 'true'
        run: npx playwright test tests/streamingDownload.spec.ts --reporter=list

      - name: Run streaming export latency integration
        if: steps.gate.outputs.run_e2e == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          BASE_URL: <REDACTED_URL>
        run: npx tsx tests/streamingExportLatency.integration.ts

      - name: Upload logs on failure
        if: failure() && steps.gate.outputs.run_e2e == 'true'
        uses: actions/<REDACTED_EMAIL>
        with:
          name: streaming-smoke-debug-logs
          path: |
            /tmp/dev-server.log
            playwright-report
            test-results
