name: RBAC HTTP integration tests

# Runs the HTTP-level RBAC integration tests against a freshly booted dev
# server. The unit tests under tests/rbacRouteLockdown.test.ts and
# tests/rbacReportRoutes.test.ts assert that ROUTE_PERMISSION_MAP is shaped
# correctly, but they do NOT prove the middleware actually enforces 403/200
# at request time. This workflow does — by signing real session cookies for
# five different roles (department_viewer, executive, quality_manager, admin,
# head_of_operations_quality), driving real fetch() calls against the running
# server, and asserting the exact response codes per role per route.
#
# A regression in:
#   - the middleware ordering (auth → role gate → handler)
#   - ROUTE_PERMISSION_MAP coverage of newly added routes
#   - session cookie parsing or HMAC verification
#   - any role's permission set
# fails this job in the same CI run as the unit tests, so the regression is
# caught before merge instead of only after deploy.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: rbac-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rbac-integration:
    name: RBAC HTTP integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: walaplus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/walaplus_test
      # Both the dev server and the test harness must use the same key,
      # otherwise the signed cookies the harness generates fail HMAC
      # verification and every request comes back 401 — never 403 — which
      # would silently mask any RBAC regression.
      SESSION_SECRET: ci-session-secret-do-not-use-in-prod
      ADMIN_API_KEY: ci-admin-key-rbac-integration
      TEST_ADMIN_KEY: ci-admin-key-rbac-integration
      BASE_URL: http://localhost:5000
      PORT: "5000"
      DATA_MODE: REAL
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply CI database schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d walaplus_test -f tests/fixtures/ci-schema.sql

      - name: Start dev server
        run: |
          npm run dev > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait for /api/health to come up (max 90 s).
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:5000/api/health > /dev/null; then
              echo "Server ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time" >&2
          tail -200 server.log >&2 || true
          exit 1

      - name: Run RBAC HTTP integration suite
        run: bash scripts/run-rbac-integration-tests.sh

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rbac-integration-server-log
          path: server.log
          if-no-files-found: ignore

      - name: Stop dev server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "${SERVER_PID}" 2>/dev/null || true
          fi
