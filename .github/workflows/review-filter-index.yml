name: Review-filter partial-index regression

# Runs the review-queue partial-index regression test against a real Postgres.
# tests/aiApprovalReviewFilterIndex.integration.ts (Task #514) seeds ≥100k
# synthetic event_logs rows and uses EXPLAIN ANALYZE to confirm the AI
# approval queue's "Unreviewed by me" / "No reviewers" NOT EXISTS sub-query
# uses the new `idx_event_logs_view_audit` partial index instead of seq-scanning
# a populated event_logs partition.
#
# Why this workflow exists
# ────────────────────────
# The unit test `tests/aiApprovalReviewFilter.test.ts` proves the SQL shape
# is right but cannot prove the planner picks the partial index once
# event_logs is large. Without this CI guard, a future schema change that
# accidentally drops or renames `idx_event_logs_view_audit`, or rewrites
# the NOT EXISTS sub-query into a shape the index can't serve, would
# silently make the queue slow at scale — we'd only find out from
# production telemetry. This job fails CI for any such regression.
#
# We follow the same opt-in-then-CI-wrapper pattern as the streaming-export
# (`.github/workflows/streaming-download-smoke.yml`) and RBAC HTTP
# (`.github/workflows/rbac-integration-tests.yml`) suites: the test file is
# wired into `tests/runIntegrationTests.ts` behind `RUN_REVIEW_FILTER_INDEX_E2E=1`,
# and this workflow is the canonical CI surface that flips that flag with the
# prerequisites (Postgres + dev-server-initialised schema) in place.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: review-filter-index-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-filter-index:
    name: Review-filter partial-index EXPLAIN regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: walaplus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/walaplus_test
      SESSION_SECRET: ci-session-secret-do-not-use-in-prod
      ADMIN_API_KEY: ci-admin-key-review-filter-index
      TEST_ADMIN_KEY: ci-admin-key-review-filter-index
      BASE_URL: http://localhost:5000
      PORT: "5000"
      DATA_MODE: REAL
      CI: "true"
      # Picked up by tests/runIntegrationTests.ts so contributors who run
      # `npm test` inside this same CI job opt into the EXPLAIN check too.
      RUN_REVIEW_FILTER_INDEX_E2E: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The test seeds rows into `event_logs` and `ai_pending_actions`.
      # Both tables (and the partial index `idx_event_logs_view_audit` itself)
      # are created on dev-server startup by `initializeEventLogsTable()` in
      # `src/utils/eventLogsDatabase.ts`. Booting the dev server first is the
      # cheapest way to get an initialised schema without duplicating the
      # DDL into a fixture. Once the schema exists the test connects to
      # Postgres directly, so the dev server is only needed for setup.
      - name: Start dev server (initialises event_logs + ai_pending_actions schema)
        run: |
          npm run dev > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait for /api/health to come up (max 90 s).
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:5000/api/health > /dev/null; then
              echo "Server ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time" >&2
          tail -200 server.log >&2 || true
          exit 1

      # Runs the EXPLAIN ANALYZE regression directly. The script seeds
      # ≥100k event_logs rows + 200 ai_pending_actions rows, ANALYZEs both
      # tables, and asserts:
      #   • idx_event_logs_view_audit exists on event_logs
      #   • Both reviewFilter EXPLAIN plans reference the partial index
      #     (parent or per-partition derived name)
      #   • Neither plan seq-scans a *populated* event_logs partition
      # Cleanup of seeded rows runs in `finally` inside the script.
      - name: Run review-filter partial-index EXPLAIN regression
        run: npx tsx tests/aiApprovalReviewFilterIndex.integration.ts

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: review-filter-index-server-log
          path: server.log
          if-no-files-found: ignore

      - name: Stop dev server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "${SERVER_PID}" 2>/dev/null || true
          fi
