name: Tool-health on-call notifier integration test

# Runs the live Slack/Resend integration test for the tool-health on-call
# notifier (`tests/toolHealthAlertNotifier.integration.ts`) using the
# production Block Kit and plaintext renderers — NOT stubs — so broken
# Block Kit shapes, bad subject lines, plaintext truncation, and
# character-escaping bugs are caught before they page on-call at 3 AM.
#
# The test file self-skips cleanly (exits 0) when none of the required
# credential pairs are configured, so this workflow is safe to leave
# enabled even on forks / PRs that do not have the optional Slack/Resend
# test secrets wired in. When the SLACK_BOT_TOKEN + SLACK_TEST_CHANNEL or
# RESEND_API_KEY + RESEND_TEST_EMAIL repository secrets ARE configured,
# the corresponding renderer is exercised end-to-end against the real
# upstream service.
#
# A regression in:
#   - the Slack Block Kit renderer
#   - the Resend subject-line / plaintext renderer
#   - character-escape / truncation logic
#   - the throttle reset shape used by the cron
# fails this job, so the regression is caught before merge instead of
# only after deploy. The same test is also wired into the main Tests
# workflow via RUN_TOOL_HEALTH_INTEGRATION_E2E=1 (see
# .github/workflows/test.yml) so even if this dedicated workflow is
# disabled or skipped, `npm test` still exercises the renderer when the
# secrets are present (and self-skips when they are not).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: tool-health-notifier-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tool-health-notifier-integration:
    name: Tool-health on-call notifier HTTP integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      # Slack/Resend credentials are pulled from repo secrets when set.
      # When unset, the test file self-skips cleanly (exits 0).
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_TEST_CHANNEL: ${{ secrets.SLACK_TEST_CHANNEL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_TEST_EMAIL: ${{ secrets.RESEND_TEST_EMAIL }}
      # Optional: when set, the Slack message embeds an absolute
      # "Open AI Operations panel" button URL.
      TOOL_HEALTH_APP_URL: ${{ secrets.TOOL_HEALTH_APP_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tool-health on-call notifier integration test
        run: bash scripts/run-tool-health-notifier-integration.sh
