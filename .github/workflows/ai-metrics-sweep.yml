name: AI metrics secret-sweep DB regression

# Task #468 — runs tests/aiCallMetricsSweepBackfill.integration.ts against a
# real Postgres so SQL-syntax errors, parameter-encoding edge cases, the
# `previews_redacted_at = NOW()` server-side stamp, and BIGSERIAL keyset
# pagination off-by-ones in `redactAiCallMetrics()` fail CI rather than
# silently leaving credential leaks on disk.
#
# Mirrors the opt-in-then-CI-wrapper pattern used by review-filter-index.yml
# and rbac-integration-tests.yml: the test is gated behind
# RUN_AI_METRICS_SWEEP_E2E=1 in tests/runIntegrationTests.ts; this workflow
# is the canonical CI surface that flips that flag with Postgres in place.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ai-metrics-sweep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-metrics-sweep:
    name: ai_call_metrics secret-sweep DB regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: walaplus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/walaplus_test
      SESSION_SECRET: ci-session-secret-do-not-use-in-prod
      ADMIN_API_KEY: ci-admin-key-ai-metrics-sweep
      TEST_ADMIN_KEY: ci-admin-key-ai-metrics-sweep
      BASE_URL: http://localhost:5000
      PORT: "5000"
      DATA_MODE: REAL
      CI: "true"
      RUN_AI_METRICS_SWEEP_E2E: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The integration test calls ensureAiMetricsTable() itself, but
      # booting the dev server first exercises the same schema-init path
      # the running app uses, so the test runs against the exact DDL
      # production sees.
      - name: Start dev server (initialises ai_call_metrics schema)
        run: |
          npm run dev > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:5000/api/health > /dev/null; then
              echo "Server ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time" >&2
          tail -200 server.log >&2 || true
          exit 1

      - name: Run ai_call_metrics secret-sweep regression
        run: npx tsx tests/aiCallMetricsSweepBackfill.integration.ts

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-metrics-sweep-server-log
          path: server.log
          if-no-files-found: ignore

      - name: Stop dev server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "${SERVER_PID}" 2>/dev/null || true
          fi
