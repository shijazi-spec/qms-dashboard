name: Streaming download — cross-browser smoke

# Runs the real-browser streaming-download smoke test (Chromium, Firefox,
# WebKit) against a freshly booted dev server. The Vitest jsdom suite covers
# the JavaScript control flow but cannot catch real-browser regressions in
# transferable ReadableStream over postMessage, the SW iframe trigger, or
# CSP changes that block the SW. This workflow does — and fails CI for any
# engine that regresses.
#
# In addition, this workflow now runs a server-side latency check against
# every export endpoint (vendors, QMS NC/CAPA, compliance, PDPL, KPIs,
# risks, duplicates, policies, event logs). The browser smoke above only
# exercises an intercepted ~80-byte fixture so it cannot detect a
# buffering regression in a single real export route. The new step
# tests/streamingExportLatency.integration.ts hits each route over HTTP
# and asserts the `X-Stream-TTFB-Ms` header (stamped by the streaming
# wrapper) is present and within EXPORT_TTFB_BUDGET_MS / EXPORT_TOTAL_BUDGET_MS,
# both defined in src/utils/excelExport.ts.
#
# Latency budget
# ──────────────
# Each browser run records the wall-clock duration of the download and
# checks it against two thresholds (defined in tests/streamingDownload.spec.ts):
#
#   LATENCY_WARN_MS = 2 000 ms  (p50 proxy)
#     The test still passes but emits a console.warn + test annotation and
#     records status "warn" in the timing artifact. Watch for repeated
#     warnings across builds — they indicate a creeping performance
#     regression.
#
#   LATENCY_FAIL_MS = 5 000 ms  (p95 proxy)
#     The test fails hard. An ~80-byte CSV that takes this long almost
#     certainly points to accidental full-body buffering, a stalled promise
#     chain, or a missed chunked-transfer-encoding header.
#
# Re-baselining
# ─────────────
# If a legitimate architectural change raises expected download latency
# (e.g. a new auth middleware step), update LATENCY_WARN_MS / LATENCY_FAIL_MS
# in tests/streamingDownload.spec.ts, explain the new expected range in the
# commit message, and adjust the "Summarise latency results" step below if
# the interpretation of the timing artifact changes.
#
# Cross-build trend tracking
# ──────────────────────────
# The hard latency budget catches single-run spikes but cannot catch a slow
# creep — e.g. download time growing +200 ms/week and crossing the fail
# threshold months later. To make creeping regressions visible early, the
# "Render latency trend" step below runs `scripts/streaming-download-trend.cjs`,
# which:
#
#   1. Uses the `gh` CLI to fetch the `streaming-download-timing` artifact
#      from the last 20 successful runs of this same workflow on the
#      default branch (artifacts have 90-day retention by default, so this
#      gives us a free, already-authenticated time-series store with no
#      new external service or secret).
#   2. Combines that history with this run's per-browser timing files.
#   3. Renders a per-browser Markdown trend table with the rolling median,
#      Δ-vs-median for every run, and a simple linear-trend slope.
#   4. Flags 🐢 "creeping regression suspected" when the current run is
#      > 1.25× the median of the last 10 runs on that browser, even when
#      still inside LATENCY_FAIL_MS.
#
# The report is appended to the GitHub Actions job summary on every run
# and posted (or updated, via `gh pr comment --edit-last`) as a sticky
# comment on pull requests, so reviewers see the trend right next to the
# PR diff. The script never fails the build — the hard fail budget is
# enforced in tests/streamingDownload.spec.ts; this step only surfaces
# slow-creep regressions that the hard budget would miss.
#
# To tune the trend window, slow-creep threshold, or default branch, see
# the env vars documented at the top of scripts/streaming-download-trend.cjs.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Required for the trend step:
#   • actions: read         → `gh run list` / `gh run download`
#   • pull-requests: write  → `gh pr comment` (sticky trend comment)
#   • contents: read        → checkout
permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: streaming-download-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Streaming-download smoke (chromium + firefox + webkit)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: walaplus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/walaplus_test
      SESSION_SECRET: ci-session-secret-do-not-use-in-prod
      ADMIN_API_KEY: ci-admin-key-streaming-smoke
      TEST_ADMIN_KEY: ci-admin-key-streaming-smoke
      BASE_URL: http://localhost:5000
      PORT: "5000"
      DATA_MODE: REAL
      CI: "true"
      # Picked up by tests/runIntegrationTests.ts so contributors who run
      # `npm test` inside this same CI job opt into the playwright leg too.
      RUN_STREAMING_DOWNLOAD_E2E: "1"
      # Picked up by tests/runIntegrationTests.ts so contributors who run
      # `npm test` inside this same CI job opt into the server-side
      # streaming-export latency check too.
      RUN_STREAMING_EXPORT_LATENCY_E2E: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium, firefox, webkit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start dev server
        run: |
          npm run dev > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait for /api/health to come up (max 90 s).
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:5000/api/health > /dev/null; then
              echo "Server ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time" >&2
          tail -200 server.log >&2 || true
          exit 1

      - name: Run streaming-download smoke (all 3 engines)
        run: npx playwright test tests/streamingDownload.spec.ts --reporter=list

      - name: Run streaming-export latency (server-side, every export endpoint)
        # Hits every export endpoint over HTTP and asserts the
        # X-Stream-TTFB-Ms header (set by `instrumentExportResponseTiming`
        # inside `stageStreamingExportFromHono`) is present and within
        # EXPORT_TTFB_BUDGET_MS. Catches backend buffering regressions in
        # any single export route — the browser smoke above only exercises
        # an intercepted ~80-byte fixture and would miss them.
        run: npx tsx tests/streamingExportLatency.integration.ts

      - name: Summarise latency results
        if: always()
        run: |
          TIMING_DIR="test-results/streaming-download-timing"
          if [ ! -d "$TIMING_DIR" ] || [ -z "$(ls -A "$TIMING_DIR" 2>/dev/null)" ]; then
            echo "No timing files found in $TIMING_DIR — test may have been skipped or crashed before recording."
            exit 0
          fi
          echo "=== Streaming-download latency summary ==="
          # Each browser writes its own JSON file to avoid parallel-worker races.
          # This step reads all of them and prints an aggregated table.
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const dir = 'test-results/streaming-download-timing';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
          const records = files.map(f => JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8')));
          records.sort((a, b) => a.browser.localeCompare(b.browser));
          const pad = (s, n) => String(s).padEnd(n);
          console.log(pad('Browser', 12) + pad('Duration (ms)', 16) + pad('Budget warn', 14) + pad('Budget fail', 14) + 'Status');
          console.log('-'.repeat(62));
          let hasWarn = false, hasFail = false;
          for (const r of records) {
            const line = pad(r.browser, 12) + pad(r.durationMs, 16) + pad(r.budget.warnMs, 14) + pad(r.budget.failMs, 14) + r.status;
            console.log(line);
            if (r.status === 'warn') hasWarn = true;
            if (r.status === 'fail')  hasFail = true;
          }
          console.log('');
          if (hasFail)  { console.error('FAIL: one or more browsers exceeded the hard latency limit.'); process.exit(1); }
          else if (hasWarn) { console.warn('WARN: one or more browsers exceeded the soft latency budget — investigate.'); }
          else          { console.log('All browsers within latency budget.'); }
          EOF

      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streaming-download-timing
          path: test-results/streaming-download-timing/
          if-no-files-found: ignore

      # Cross-build trend report. See the "Cross-build trend tracking"
      # section at the top of this workflow for the full rationale.
      #
      # Runs on `if: always()` so a hard latency fail in the smoke test
      # still produces (and posts) a trend report — that is precisely
      # when reviewers most want to see "is this a one-off spike or the
      # tail end of a creep?".
      #
      # The script itself never exits non-zero; the hard fail budget is
      # enforced earlier in the Playwright spec.
      - name: Render latency trend (history + this run)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Defaults baked into the script can be overridden here without
          # editing scripts/streaming-download-trend.cjs.
          STREAMING_TREND_HISTORY_LIMIT: "20"
          STREAMING_TREND_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          node scripts/streaming-download-trend.cjs

      - name: Append trend report to job summary
        if: always()
        run: |
          REPORT="test-results/streaming-trend-summary.md"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_(no streaming-download trend report was produced)_" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Sticky PR comment: finds the previous trend comment by its
      # HTML marker (`<!-- streaming-download-trend -->`, emitted at
      # the bottom of the report by scripts/streaming-download-trend.cjs)
      # and PATCHes it in place — so the trend report becomes a single
      # sticky comment instead of one per push, AND we never accidentally
      # overwrite an unrelated bot comment (which `gh pr comment
      # --edit-last` could do in repos with multiple bot integrations).
      #
      # `continue-on-error: true` so this step never fails the smoke
      # job: on fork-based PRs the `GITHUB_TOKEN` is read-only and
      # `gh api -X PATCH` will 403; the trend report is still in the
      # job summary and as an artifact, so reviewers can still see it.
      - name: Post / update sticky PR comment with trend
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MARKER: '<!-- streaming-download-trend -->'
        run: |
          REPORT="test-results/streaming-trend-summary.md"
          if [ ! -f "$REPORT" ]; then
            echo "No trend report to post."
            exit 0
          fi

          # Find an existing trend comment by HTML marker. List comments
          # paginated so we don't miss long histories. jq selects the
          # first comment whose body contains our marker.
          EXISTING_ID=$(
            gh api --paginate \
              "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${MARKER}\"))][0].id"
          )

          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
            echo "Updating existing trend comment id=${EXISTING_ID}"
            gh api -X PATCH \
              "repos/${GH_REPO}/issues/comments/${EXISTING_ID}" \
              -F body=@"$REPORT" > /dev/null
          else
            echo "No prior trend comment found — creating a new one."
            gh pr comment "$PR_NUMBER" --body-file "$REPORT"
          fi

      - name: Upload trend report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streaming-download-trend
          path: test-results/streaming-trend-summary.md
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          if-no-files-found: ignore

      - name: Stop dev server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "${SERVER_PID}" 2>/dev/null || true
          fi
