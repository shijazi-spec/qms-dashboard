name: Secret-redaction tests

# Runs the dedicated secret-redaction regression gates on every push and
# pull request. These tests prove that we never write a credential into
# event_logs / change_history / ai_pending_actions:
#
#   - src/utils/redactSensitiveFields.test.ts
#       Patches pg.Pool.prototype.query so logEvent() calls can be inspected.
#       Asserts no raw secrets (password_hash, mfa_secret, access_token,
#       refresh_token, api_key, sk_*, ghp_*, JWT, bcrypt, ...) reach the
#       captured INSERT params. (Task #37)
#
#   - tests/eventLogDescriptionSweep.test.ts
#       Verifies redactEventLogs() in src/utils/redactHistoricalLogs.ts
#       scrubs both TEXT (description / entity_name) and JSONB columns
#       (old_value / new_value) on the historical sweep, and is idempotent
#       on a second pass. (Task #100)
#
# Both tests use in-memory stubs and do NOT require a live Postgres, so this
# job is intentionally minimal (no services:) and fast. Either test exiting
# non-zero blocks the merge, and the per-step run separation in this file
# (plus the `set -o pipefail` + `tee` writeup to $GITHUB_STEP_SUMMARY) makes
# it obvious from the GitHub Actions UI which file's assertion failed.
#
# These same files are also auto-discovered by tests/runIntegrationTests.ts
# and run as part of `npm test` in the main Tests workflow — this dedicated
# job is the explicit, fast, isolated gate that the task #455 brief asked
# for, so a future refactor that drops deepRedactSecretLikeStrings can't
# slip past CI even if the broader integration suite is skipped or flaky.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: secret-redaction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-redaction:
    name: Secret-redaction regression gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: "redactSensitiveFields.test.ts (Task #37 — logEvent secret-leak gate)"
        id: redact_sensitive_fields
        shell: bash
        run: |
          set -o pipefail
          echo "## redactSensitiveFields.test.ts" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx tsx src/utils/redactSensitiveFields.test.ts 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "❌ **redactSensitiveFields.test.ts FAILED** — see captured output above." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ redactSensitiveFields.test.ts passed." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: "eventLogDescriptionSweep.test.ts (Task #100 — historical sweep gate)"
        # Run even if the first test failed so engineers see *both* signals
        # in a single CI run instead of having to push, fix, push again.
        if: ${{ always() }}
        id: event_log_description_sweep
        shell: bash
        run: |
          set -o pipefail
          echo "## eventLogDescriptionSweep.test.ts" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx tsx tests/eventLogDescriptionSweep.test.ts 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "❌ **eventLogDescriptionSweep.test.ts FAILED** — see captured output above." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ eventLogDescriptionSweep.test.ts passed." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: "noInlineTelemetryMetadata.test.ts (Task #511 — telemetry metadata guardrail)"
        # Defence-in-depth complement to the BuiltAiCallTelemetryMetadata brand
        # in src/utils/aiTelemetry.ts. The brand makes inline `metadata: { ... }`
        # literals at withAiTelemetry() / startTelemetrySpan() /
        # recordStreamTelemetry() fail TypeScript already; this gate catches
        # any `as any` / untyped-JS bypass that would slip a `catch (err)`
        # payload into ai_call_metrics.metadata. Keeps the streaming code-path
        # held to the same standard as the non-streaming callers Task #484
        # locked down.
        if: ${{ always() }}
        id: no_inline_telemetry_metadata
        shell: bash
        run: |
          set -o pipefail
          echo "## noInlineTelemetryMetadata.test.ts" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx tsx tests/noInlineTelemetryMetadata.test.ts 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "❌ **noInlineTelemetryMetadata.test.ts FAILED** — see captured output above." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ noInlineTelemetryMetadata.test.ts passed." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: "aiTelemetryMetadata.test.ts (Task #484/#511 — builder + brand contract)"
        # The companion compile-time gate: verifies buildAiCallTelemetryMetadata()
        # round-trips the camelCase ↔ snake_case mapping correctly AND that the
        # BuiltAiCallTelemetryMetadata brand rejects inline literals at the
        # three telemetry entry points (// @ts-expect-error). The npm `check`
        # (tsc) job enforces the brand at compile time across the repo; this
        # tsx run additionally verifies the runtime mapping and console.warn
        # for `as any` bypasses.
        if: ${{ always() }}
        id: ai_telemetry_metadata_builder
        shell: bash
        run: |
          set -o pipefail
          echo "## aiTelemetryMetadata.test.ts" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx tsx src/utils/__tests__/aiTelemetryMetadata.test.ts 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "❌ **aiTelemetryMetadata.test.ts FAILED** — see captured output above." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ aiTelemetryMetadata.test.ts passed." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
