name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Integration tests (npm test)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb
      # Same key used by the dev server below AND by the RBAC integration
      # test harness. Both sides MUST agree, otherwise signed cookies fail
      # HMAC verification and every request comes back 401 instead of 403,
      # silently masking any RBAC regression.
      SESSION_SECRET: ci-session-secret-do-not-use-in-prod
      ADMIN_API_KEY: ci-admin-key-tests
      TEST_ADMIN_KEY: ci-admin-key-tests
      BASE_URL: http://localhost:5000
      PORT: "5000"
      DATA_MODE: REAL
      CI: "true"
      # Tells tests/runIntegrationTests.ts to additionally run
      # tests/rbacRouteLockdown.integration.ts and
      # tests/rbacReportRoutes.integration.ts (via
      # scripts/run-rbac-integration-tests.sh) inside this same npm test
      # invocation, so a route-lockdown middleware regression fails the
      # standard test job — not just the dedicated workflow.
      RUN_RBAC_INTEGRATION_E2E: "1"
      # Tells tests/runIntegrationTests.ts to additionally run
      # tests/aiApprovalRoutesRedaction.integration.ts (via
      # scripts/run-ai-approval-redaction-integration.sh) inside this
      # same npm test invocation, so a regression in the secret-redaction
      # path through GET /api/ai/approvals* and POST /approve fails the
      # standard test job — not just the dedicated workflow (Task #348).
      RUN_APPROVAL_REDACTION_INTEGRATION_E2E: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start dev server (for RBAC HTTP integration tests)
        run: |
          npm run dev > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait for /api/health to come up (max 90 s).
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:5000/api/health > /dev/null; then
              echo "Server ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time" >&2
          tail -200 server.log >&2 || true
          exit 1

      - name: Run integration test suite (incl. RBAC HTTP integration via RUN_RBAC_INTEGRATION_E2E=1)
        run: npm test

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-server-log
          path: server.log
          if-no-files-found: ignore

      - name: Stop dev server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "${SERVER_PID}" 2>/dev/null || true
          fi

  typecheck:
    name: TypeScript compile check (npm run check)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compile check
        id: tsc
        shell: bash
        run: |
          # Run tsc, tee its output for later parsing, but preserve the
          # real exit code (set -eo pipefail is the GH Actions default for
          # bash steps, so we have to explicitly capture the failure).
          status=0
          npm run check 2>&1 | tee tsc-output.txt || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Summarize TypeScript errors
        if: always() && steps.tsc.outputs.status != '0'
        shell: bash
        run: |
          # Pull standard tsc diagnostic lines:
          #   path/to/file.ts(LINE,COL): error TSxxxx: message
          grep -E '^[^[:space:]].*\([0-9]+,[0-9]+\): error TS[0-9]+:' \
            tsc-output.txt > tsc-errors.txt || true
          total=$(wc -l < tsc-errors.txt | tr -d ' ')

          {
            echo "## :x: TypeScript compile errors"
            echo ""
            if [ "$total" = "0" ]; then
              echo "\`tsc\` exited with a non-zero status but no per-file"
              echo "diagnostics were detected. See the raw step log for details."
            else
              echo "Found **${total}** type error(s). Run \`npm run check\` locally to reproduce."
              echo ""
              echo "### Files with errors"
              echo ""
              echo "| File | Errors |"
              echo "| --- | ---: |"
              awk -F'(' '{print $1}' tsc-errors.txt \
                | sort \
                | uniq -c \
                | sort -rn \
                | awk '{count=$1; $1=""; sub(/^ /, ""); printf "| `%s` | %d |\n", $0, count}'
              echo ""
              echo "### First 50 diagnostics"
              echo ""
              echo '```'
              head -50 tsc-errors.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tsc output on failure
        if: always() && steps.tsc.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: tsc-output
          path: tsc-output.txt
          if-no-files-found: ignore

  format:
    name: Prettier formatting check (npm run check:format)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier formatting check
        id: prettier
        shell: bash
        run: |
          # Same pattern as the typecheck step: tee + capture exit code so
          # the follow-up summary step can parse the output even on failure.
          status=0
          npm run check:format 2>&1 | tee prettier-output.txt || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Summarize Prettier issues
        if: always() && steps.prettier.outputs.status != '0'
        shell: bash
        run: |
          # Prettier --check emits one "[warn] <file>" line per offending
          # file, plus summary "[warn] Code style issues..." lines we
          # explicitly drop.
          grep -E '^\[warn\] ' prettier-output.txt \
            | grep -vE '^\[warn\] Code style issues' \
            | grep -vE '^\[warn\] Forgot to run Prettier' \
            | sed -E 's/^\[warn\] //' > prettier-files.txt || true
          total=$(wc -l < prettier-files.txt | tr -d ' ')

          {
            echo "## :x: Prettier formatting issues"
            echo ""
            if [ "$total" = "0" ]; then
              echo "\`prettier --check\` exited with a non-zero status but no"
              echo "per-file warnings were detected. See the raw step log for details."
            else
              echo "Found **${total}** file(s) that need reformatting."
              echo ""
              echo "Run \`npm run format\` locally to auto-fix, then commit the result."
              echo ""
              echo "### Files needing reformatting"
              echo ""
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                echo "- \`$f\`"
              done < prettier-files.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Prettier output on failure
        if: always() && steps.prettier.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: prettier-output
          path: prettier-output.txt
          if-no-files-found: ignore
