name: Typecheck

# Runs `tsc` against the project on every push and PR.
#
# History: when this workflow was first introduced, both jobs ran with
# `continue-on-error: true` because src/ carried ~900 pre-existing type
# errors that had been hidden by the absence of any CI typecheck step.
# A series of root-cause shared-definition fixes (LogPayload → unknown,
# action_type/entity_type → string, UserRole adds "viewer", SessionUser
# gets `id`, etc.) plus per-file cleanup drove the count to 0. Both jobs
# are now hard gates — a regression in either typecheck blocks merge.
#
# To intentionally introduce a temporary regression (e.g. a refactor
# split across multiple PRs), revert the specific step to
# `continue-on-error: true` with a comment naming the tracking issue.

on:
  push:
    branches: [main, QMS]
  pull_request:
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Hard gate, and it runs BEFORE the install on purpose — see the long
      # note where this step used to live (below the tsc gates) for why it
      # moved on 2026-09-09.
      - name: lockfile registry guard
        run: node scripts/check-lockfile-registry.mjs

      - name: Install dependencies
        run: npm ci

      # Hard gate: src + scripts must type-check.
      - name: tsc (src + scripts)
        run: npm run check

      # Hard gate: tests must type-check.
      - name: tsc (tests)
        run: npm run check:tests

      # Hard gate: every <script> block in dashboard/*.html must parse
      # cleanly. Catches the class of bug that took the dashboard down
      # on 2026-05-28 — backticks inside an HTML comment nested in a JS
      # template literal closed the outer template early, and the JS
      # never even loaded in the browser. tsc doesn't see this because
      # the code lives in .html files; this script does.
      - name: dashboard HTML <script> syntax check
        run: node scripts/check-dashboard-html-js.mjs

      # (The lockfile registry guard used to sit here. Kept as a note because
      # the reasoning that put it here was wrong in a way worth recording.)
      #
      # Every package-lock.json `resolved` URL must point at a public registry.
      # `npm install` inside a Replit workspace rewrites them to
      # http://package-firewall.replit.{local,internal}/npm/…, which resolves
      # ONLY there. It was placed after the tsc gates on the theory that a
      # polluted lockfile always degrades quietly — npm leaves the package
      # directory EMPTY and does NOT fail `npm ci` — so a type error would be
      # the more actionable signal to surface first.
      #
      # On 2026-09-09 (hono 4.13.7, `.internal` host) `npm ci` did NOT degrade
      # quietly: it hard-failed at the install step. Every step after it,
      # including this guard, was SKIPPED. So the one check that knew the answer
      # never ran, and the notification read "Typecheck: All jobs have failed"
      # when nothing had been type-checked at all.
      #
      # It now runs before `npm ci`. It only reads a JSON file with node
      # builtins, so it needs no node_modules and costs about a second.

      # Blocking gate: unreachable route registrations. Routes are matched in
      # registration order, so a duplicate (path, method) or a literal path
      # sitting below a parameterised one is dead code that tsc and the test
      # suite cannot see. Two of these shipped to production — the bell's
      # "Mark all read" writing to a shadowed handler, and
      # GET /api/audits/evidence-packs returning 404 because it sat under
      # /api/audits/:id. Known-and-accepted collisions live in the script's
      # BASELINE map; anything new fails here.
      - name: route collisions (unreachable registrations)
        run: node scripts/check-route-collisions.mjs

      # Blocking gate (strict since 2026-09-13): schema canonical-source
      # parity. Catches a column added by a runtime ALTER TABLE ADD COLUMN
      # that is missing from the canonical CREATE TABLE — the drift that got
      # Replit's deploy-time schema-diff to propose DROPping the audio_blob
      # columns on 2026-05-28 ("delete audio_blob column … with 208 items"),
      # one approval click away from permanent data loss in production.
      #
      # This ran in warning mode for months because of 75 historical drift
      # instances. Those were cleared on 2026-06-17, and the tree was verified
      # clean again before this flip (0 drift, 170 ALTERs, 218 tables), so the
      # step now fails the run. If it goes red, add the column to the CREATE
      # TABLE block — do not put the step back into warning mode.
      #
      # It runs LAST, and with `!cancelled()`, on purpose: it reads source
      # files with node builtins only and needs no node_modules, so it must
      # not be skipped just because an earlier step failed. That is exactly
      # how the lockfile guard was silenced on 2026-09-09.
      #
      # Drift lines are re-emitted as ::error annotations because job logs
      # require sign-in to read: without this, a red check would not say which
      # column drifted.
      - name: schema canonical-source parity
        if: ${{ !cancelled() }}
        run: |
          if node scripts/check-schema-parity.mjs --strict > parity.out 2>&1; then
            cat parity.out
          else
            rc=$?
            cat parity.out
            grep -a "runtime ALTER adds" parity.out | head -10 | sed -E 's/^[^ ]+ ([^ :]+):([0-9]+) [^ ]+ runtime ALTER adds ([^ ]+) .*$/::error file=\1,line=\2,title=Schema parity drift::\3 is added by a runtime ALTER but is missing from the canonical CREATE TABLE/'
            echo "::error title=Schema parity::check-schema-parity --strict failed (exit $rc). Add the column above to its canonical CREATE TABLE block; see scripts/check-schema-parity.mjs for why this matters."
            exit $rc
          fi
