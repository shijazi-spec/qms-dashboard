name: Tests

# Runs the platform test suite on every push and PR.
#
# WHY THIS EXISTS
# ---------------
# The repo carries ~241 test files (171 under tests/*.test.ts, 70 colocated
# under src/**/*.test.ts) plus the vitest suites in tests/vitest/**. Before
# this workflow, NONE of them ran in CI — `typecheck.yml` only type-checks
# them (`tsc -p tsconfig.tests.json`), which proves they COMPILE but never
# that they PASS. All the test-writing effort produced zero regression
# protection on ~245K lines of code.
#
# Two real regressions that a running suite would have caught:
#   - the `.wp-topstrip button { display: inline-flex }` rule silently
#     out-specified `.wp-mobile-menu-btn { display: none }`, so two hamburger
#     icons rendered side-by-side on desktop for weeks;
#   - a concurrent session's commit swept up half a feature's edits without
#     the type definition that made them compile, reddening CI on the
#     NEXT commit rather than its own.
#
# ROLLOUT: NON-BLOCKING FIRST
# ---------------------------
# The test step runs with `continue-on-error: true` so this workflow reports
# the true pass/fail baseline WITHOUT blocking merges on day one. Once the
# baseline is green (or the known-failing files are fixed/quarantined), drop
# the `continue-on-error` line to make it a hard gate — same pattern
# typecheck.yml used when it was introduced against ~900 pre-existing errors.
#
# ENTRY POINT
# -----------
# `npm test` → `npx tsx tests/runIntegrationTests.ts`, which discovers every
# tests/*.test.ts + src/**/*.test.ts, runs each in its own tsx subprocess
# (so DB pools / env mutation stay isolated), then invokes `npx vitest run`
# for the mock-dependent suites. It exits non-zero if any file fails. The
# heavy end-to-end suites are opt-in behind RUN_*_E2E env vars and skip
# cleanly when unset — we deliberately do NOT set them here; they have their
# own dedicated workflows (streaming-download-smoke.yml et al).

on:
  push:
    branches: [main, QMS]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Real Postgres rather than the dummy connection string the test files
    # fall back to (`postgres://test:test@localhost:5432/test`). Strictly
    # better: files that only need a parseable URL are unaffected, while
    # files that actually connect exercise real SQL — which is what catches
    # the schema-drift class of bug at test time instead of at deploy time.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: qms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Runs before the install, and the reason is this workflow's own history:
      # a lockfile carrying Replit's internal proxy host has taken this suite
      # down twice — once quietly (empty node_modules/.bin -> "tsx: not found",
      # exit 127, which is what the elaborate repair + diagnostic steps below
      # were built to chase) and once loudly (2026-09-09: `npm ci` hard-failed,
      # and every step below — repair, diagnostics, the suite itself — was
      # SKIPPED, so none of that machinery produced a single annotation).
      # Checking the lockfile first turns both into one clear message.
      - name: lockfile registry guard
        run: node scripts/check-lockfile-registry.mjs

      - name: Install dependencies
        run: npm ci

      # ROOT CAUSE (found via the annotation diagnostics below on run
      # 31276980758): `npm ci` installs the packages but leaves
      # `node_modules/.bin` completely EMPTY — 0 entries. So every package is
      # present on disk (node's own `require.resolve('tsx/package.json')`
      # resolves fine) but nothing is on PATH, and `npm test`'s
      # `npx tsx …` dies with `sh: 1: tsx: not found` -> exit 127.
      #
      # It is not a config problem: `npm config get bin-links` is `true` and
      # package-lock.json does record tsx's bin (`{"tsx": "dist/cli.mjs"}`).
      # The same empty-.bin state reproduces on a local Windows checkout, so
      # it is repo/lockfile-specific rather than a CI quirk.
      #
      # `npm rebuild` is npm's documented way to recreate bin links from the
      # already-installed tree. It is cheap (no network — nothing is
      # re-downloaded) and idempotent, so it is safe to run unconditionally:
      # if a future npm version fixes the underlying bug this step simply
      # becomes a no-op.
      #
      # This also matters for more than the top-level command:
      # tests/runIntegrationTests.ts spawns `npx tsx <file>` per test file and
      # `npx vitest run` for the vitest suites, so .bin has to be populated
      # for the suite to work at all — pointing the top-level call at an
      # absolute path would not have been enough.
      # `npm rebuild` alone is NOT sufficient: on the runner it exits 1 after
      # about a second (some package's rebuild fails), and because GitHub
      # applies `set -e` to bash steps that aborted the whole job and skipped
      # everything downstream. So this step is tolerant by design:
      #   1. try `npm rebuild`, capturing its exit code + output instead of
      #      letting a partial failure kill the run;
      #   2. if the shims we actually need are still missing, synthesise them
      #      directly from each package's own `bin` field — that is all npm
      #      would have done anyway;
      #   3. only hard-fail if tsx is STILL unusable afterwards.
      # `continue-on-error` keeps the diagnostics + baseline running even then.
      - name: Repair node_modules/.bin (npm ci leaves it empty)
        continue-on-error: true
        run: |
          echo "::warning title=bin-1-before::entries=$(ls node_modules/.bin 2>/dev/null | wc -l)"

          npm rebuild > /tmp/rebuild.log 2>&1 && RC=0 || RC=$?
          echo "::warning title=bin-2-rebuild::exit=${RC} tail=$(tail -c 400 /tmp/rebuild.log | tr '\n' ' ' | tr -d '\r')"
          echo "::warning title=bin-3-after-rebuild::entries=$(ls node_modules/.bin 2>/dev/null | wc -l)"

          # Fallback: build the shims ourselves from each package's `bin`
          # field. Writes a tiny `exec node <abs-path>` wrapper, which is
          # exactly what npx/PATH need and is immune to whatever made
          # `npm rebuild` fail.
          cat > /tmp/mkshims.cjs <<'NODEEOF'
          const fs = require("fs");
          const path = require("path");
          const binDir = path.join(process.cwd(), "node_modules", ".bin");
          fs.mkdirSync(binDir, { recursive: true });
          for (const name of ["tsx", "vitest"]) {
            let pkgPath;
            try {
              pkgPath = require.resolve(name + "/package.json", { paths: [process.cwd()] });
            } catch (e) {
              console.log("SKIP " + name + " (not installed)");
              continue;
            }
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            const dir = path.dirname(pkgPath);
            let bins = pkg.bin;
            if (typeof bins === "string") bins = { [pkg.name]: bins };
            for (const [binName, rel] of Object.entries(bins || {})) {
              const target = path.join(dir, rel);
              const shim = path.join(binDir, binName);
              if (fs.existsSync(shim)) { console.log("KEEP " + binName); continue; }
              fs.writeFileSync(shim, '#!/bin/sh\nexec node "' + target + '" "$@"\n');
              fs.chmodSync(shim, 0o755);
              console.log("SHIM " + binName + " -> " + target);
            }
          }
          NODEEOF
          node /tmp/mkshims.cjs > /tmp/shims.log 2>&1 && SRC=0 || SRC=$?
          echo "::warning title=bin-4-shims::exit=${SRC} $(tr '\n' ' ' < /tmp/shims.log | tr -d '\r' | cut -c1-400)"

          FINAL=$(ls node_modules/.bin 2>/dev/null | wc -l)
          HITS=$(ls node_modules/.bin 2>/dev/null | grep -E '^(tsx|vitest|tsc)$' | tr '\n' ',')
          VER=$(npx tsx --version 2>&1 | tr '\n' ' ' | cut -c1-160)
          echo "::warning title=bin-5-final::entries=${FINAL} hits=[${HITS}] npx_tsx=${VER}"

          if ! npx tsx --version > /dev/null 2>&1; then
            echo "::error title=bin-repair-failed::tsx is still not runnable after rebuild + shim fallback; the suite cannot start"
            exit 1
          fi

      # The first run of this workflow exited 127 ("command not found") in
      # ~40s without running a single test, and `continue-on-error` masked it
      # as a green job. Downloading the raw log needs repo-admin rights, so
      # this step makes the runner self-diagnosing instead: it prints exactly
      # which of node / npm / npx / tsx is missing. Cheap (a few seconds) and
      # it runs unconditionally so a future 127 is never a mystery again.
      # Findings are emitted as `::warning::` workflow commands, NOT plain
      # stdout. Raw step logs need repo-admin rights to download, but
      # annotations are readable anonymously via
      # `GET /repos/:o/:r/check-runs/:id/annotations` — so this is the one
      # channel that actually surfaces the answer without admin access.
      # Each message is truncated so it can't blow the annotation size cap.
      - name: Environment diagnostics
        continue-on-error: true
        run: |
          trunc() { tr '\n' ' ' | tr -d '\r' | cut -c1-700; }

          NODE_V=$(node -v 2>&1 | trunc)
          NPM_V=$(npm -v 2>&1 | trunc)
          NPX_V=$(npx --version 2>&1 | trunc)
          echo "::warning title=diag-1-versions::node=${NODE_V} npm=${NPM_V} npx=${NPX_V}"

          WHICH_TSX=$(command -v tsx 2>&1 || echo 'NOT-ON-PATH')
          BIN_HITS=$(ls node_modules/.bin 2>/dev/null | grep -E '^(tsx|vitest|tsc|prettier)$' | tr '\n' ',' || echo 'NONE')
          BIN_COUNT=$(ls node_modules/.bin 2>/dev/null | wc -l || echo 0)
          echo "::warning title=diag-2-tsx-resolution::which=${WHICH_TSX} | .bin hits=[${BIN_HITS}] | .bin total entries=${BIN_COUNT}"

          RESOLVE=$(node -e "console.log(require.resolve('tsx/package.json'))" 2>&1 | trunc)
          echo "::warning title=diag-3-require-resolve::${RESOLVE}"

          NPX_TSX=$(npx tsx --version 2>&1 | trunc)
          echo "::warning title=diag-4-npx-tsx-version::${NPX_TSX}"

          # NOTE: this step used to also run `timeout 90 npm test` to capture
          # the failure. That was how the exit-127 and the missing-vite
          # breakage were found — but now that the suite genuinely runs, it is
          # pure duplication that burned 90s of every run. The real
          # "Run test suite" step below reports the tally itself.

      # The postgres service above starts EMPTY and `npm test` runs straight
      # against it. Most of the suite copes — this app owns its schema at
      # runtime, so a test that exercises a feature triggers the lazy
      # `CREATE TABLE IF NOT EXISTS` that owns its table on the way through.
      #
      # A test that seeds through a data helper does not. aiOpsRoutes calls
      # createAIAlert() with nothing having called initAIAlertsTable(), and one
      # run reported `relation "ai_alerts" does not exist` 24 times while the
      # same test passed on every developer machine, where the feature had been
      # exercised once long ago. Six of eleven failing files were this.
      #
      # Deliberately NOT `continue-on-error`: if the schema cannot be created,
      # the suite's DB failures are noise and the run should say so at the step
      # that actually broke.
      - name: Bootstrap test schema
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/qms_test
          ALLOW_TEST_SCHEMA_BOOTSTRAP: "1"
        run: |
          npx tsx scripts/createQMSTables.ts
          npx tsx scripts/bootstrap-test-schema.ts

      # Non-blocking while we establish the baseline. Remove
      # `continue-on-error` to promote this to a hard gate.
      - name: Run test suite
        id: tests
        continue-on-error: true
        env:
          # The four vars test files self-default (`process.env.X || "..."`).
          # Setting them explicitly means the suite runs against known values
          # rather than per-file fallbacks that drift over time.
          DATABASE_URL: postgres://test:test@localhost:5432/qms_test
          SESSION_SECRET: ci-test-session-secret-not-a-real-secret
          ADMIN_API_KEY: ci-test-admin-key-not-a-real-secret
          REPLIT_DOMAINS: localhost:5000
          # Bounded so a runaway suite can't eat the whole 30-minute budget
          # on a 2-core runner.
          TEST_CONCURRENCY: "4"
        # Tee the run so the tally + failing-file list can be republished as
        # annotations. Raw step logs need repo-admin rights to download, so
        # without this the baseline numbers would be invisible from the API.
        # `PIPESTATUS[0]` is npm's status (not tee's), captured before any
        # other command can clobber it.
        run: |
          set +e
          npm test 2>&1 | tee /tmp/test-output.log
          RC=${PIPESTATUS[0]}
          set -e

          SUMMARY=$(grep -a 'test files passed' /tmp/test-output.log | tail -1 | tr -d '\r')

          echo "::warning title=test-1-exit::exit_code=${RC}"
          echo "::warning title=test-2-tally::${SUMMARY:-<no summary line — suite likely crashed before finishing>}"

          # --- failing FILE list -------------------------------------------
          # This used to be `grep -a 'FAIL' | head -25 | cut -c1-900`, which
          # reliably showed only ~4 of 12 failing files. The cap was not the
          # problem; the grep was. Bare "FAIL" also matches:
          #   - every app log line containing FAILED, e.g.
          #     "📋 [EventLogs] AUDIT WRITE FAILED - action applied but not recorded"
          #   - vitest's per-TEST lines (many per file), ANSI-coloured
          # Those appear earlier in the log than the summary block, so they ate
          # the whole budget before a single filename was reached.
          #
          # runIntegrationTests.ts prints one line per file in a fixed format
          # (see its summary loop):
          #     [FAIL (exit 1)] 12.3s  tests/foo.test.ts
          # Anchoring on the literal "[FAIL" — bracket included, fixed-string —
          # yields exactly one line per failing file and excludes both noise
          # sources. ANSI is stripped first so vitest's colouring cannot smuggle
          # escape bytes into an annotation.
          # One ANSI-stripped copy, reused by every extraction below rather than
          # re-stripping per grep. vitest colours its output, and escape bytes
          # inside an annotation render as mojibake and eat the size cap.
          sed -e 's/\x1b\[[0-9;]*m//g' /tmp/test-output.log > /tmp/test-clean.log || true

          grep -aF '[FAIL' /tmp/test-clean.log \
            | sed -e 's/^[[:space:]]*//' \
            > /tmp/failing-files.txt || true
          NFAIL=$(wc -l < /tmp/failing-files.txt | tr -d ' ')

          # Emitted in chunks rather than one annotation per file: GitHub keeps
          # only ~10 annotations per level per step, and this step already emits
          # 4 others. 8 files/chunk x 3 chunks covers 24 failures while leaving
          # headroom. Each chunk is far below the size cap now that the lines are
          # just paths (~35 chars each).
          if [ "${NFAIL}" -eq 0 ]; then
            echo "::warning title=test-3-failing-files::<none — no '[FAIL' lines in the summary block>"
          else
            i=0; idx=0
            while [ "$i" -lt "${NFAIL}" ] && [ "$idx" -lt 3 ]; do
              idx=$((idx + 1))
              PART=$(sed -n "$((i + 1)),$((i + 8))p" /tmp/failing-files.txt | tr '\n' '|' | tr -d '\r' | cut -c1-1800)
              echo "::warning title=test-3-failing-files-${idx}-of-${NFAIL}::${PART}"
              i=$((i + 8))
            done
            if [ "$i" -lt "${NFAIL}" ]; then
              echo "::warning title=test-3-failing-files-overflow::$((NFAIL - i)) further failing file(s) not listed; see the job summary"
            fi
          fi

          # Per-assertion detail. The failing-files list alone says WHICH file
          # broke but never WHY, and the raw log needs repo-admin rights to
          # download — so triage previously meant reproducing locally, which
          # is impossible for the DB-backed suites when the dev box has no
          # Postgres. These two annotations carry the actual assertion text.
          # ANSI-stripped for the same reason as the file list, and split across
          # two annotations because assertion text is long — 900 chars fit only
          # about four of them.
          grep -a '✗' /tmp/test-clean.log \
            | sed -e 's/^[[:space:]]*//' | head -16 > /tmp/failing-assertions.txt || true
          NASSERT=$(wc -l < /tmp/failing-assertions.txt | tr -d ' ')
          if [ "${NASSERT}" -eq 0 ]; then
            echo "::warning title=test-4-assertions::<no ✗ lines captured>"
          else
            # Plain `if`, not `[ ... ] && break`: this step re-enables `set -e`
            # before the annotation block, and a trailing bare AND-list whose
            # test fails is exactly the shape that has aborted steps here before.
            for part in 1 2; do
              start=$(( (part - 1) * 8 + 1 ))
              if [ "$start" -le "${NASSERT}" ]; then
                CHUNK=$(sed -n "${start},$(( part * 8 ))p" /tmp/failing-assertions.txt | tr '\n' '|' | tr -d '\r' | cut -c1-1800)
                echo "::warning title=test-4-assertions-${part}::${CHUNK}"
              fi
            done
          fi
          ERRS=$(grep -aoE "(Cannot find package '[^']*'|ECONNREFUSED [0-9.:]+|relation \"[a-z_]+\" does not exist|[A-Za-z]*Error: [^\\\"]{0,90})" /tmp/test-output.log | sort | uniq -c | sort -rn | head -8 | tr '\n' ' ' | tr -d '\r' | cut -c1-900)
          echo "::warning title=test-5-error-kinds::${ERRS:-<none>}"

          # WHY a file failed, for the files that never print an assertion.
          # ------------------------------------------------------------------
          # The ✗ capture above only sees a test that FAILED an assertion. A test
          # that THROWS — a query returning undefined, a missing row, a rejection
          # in setup — exits non-zero having printed no ✗ at all, so it landed in
          # the failing-files list and nowhere else. Two files sat undiagnosable
          # through a whole day of runs for exactly this reason: they passed
          # locally, and the only record of why they failed here was a log that
          # needs repo-admin rights to download.
          #
          # runIntegrationTests.ts buffers each subprocess and flushes it as one
          # labelled block (see runOne), so a block is contiguous even at
          # TEST_CONCURRENCY=4:
          #     ──── tests/foo.test.ts  (2.0s, exit 1) ────
          # For each failing file we keep the TAIL of its block, which is where a
          # thrown error and its stack land.
          : > /tmp/failing-tails.txt
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            # Drop the "[FAIL (exit N)] 12.3s  " prefix. The label is everything
            # after the duration and can itself contain spaces — vitest's is
            # "tests/vitest/** (vitest)" — so take fields 5..NF, not $NF.
            f=$(printf '%s\n' "$line" | awk '{ $1=""; $2=""; $3=""; $4=""; sub(/^[[:space:]]+/, ""); print }')
            [ -n "$f" ] || continue
            {
              echo "──────── ${f}"
              # index() not a regex: the label contains ** and ( ) which would
              # otherwise need escaping.
              # Two stop conditions, not one. The next block header ends most
              # blocks — but the LAST block flushed has no header after it, so
              # without the second condition it ran to EOF and swallowed the
              # runner's summary. That summary is one line per file, so with 267
              # files `tail -25` would have shown 25 lines of summary and none of
              # the error. Found by running this against a synthetic log.
              awk -v f="$f" '
                index($0, "──── " f "  (") == 1 { inblk = 1; next }
                inblk && index($0, "──── ") == 1 { inblk = 0 }
                inblk && $0 ~ /^[[:space:]]*\[(PASS\]|FAIL \(exit)/ { inblk = 0 }
                inblk { print }
              ' /tmp/test-clean.log | tail -25
              echo ""
            } >> /tmp/failing-tails.txt
          done < /tmp/failing-files.txt

          # One annotation, not a chunked set: the budget above is nearly spent,
          # and this only needs to answer "did something throw, and what".
          FIRSTERR=$(grep -aoE "([A-Za-z]*Error: [^\"]{0,120}|relation \"[a-z_]+\" does not exist)" /tmp/failing-tails.txt | head -3 | tr '\n' '|' | tr -d '\r' | cut -c1-900)
          # NO APOSTROPHE in the default text. Bash treats a single quote inside
          # a ${VAR:-default} expansion as opening a quote even when the whole
          # expansion is already inside double quotes, so "...file's output"
          # aborts the step with "unexpected EOF while looking for matching `''".
          echo "::warning title=test-6-first-throw::${FIRSTERR:-<no error-shaped line in the failing output>}"

          {
            echo "### Test baseline"
            echo ""
            echo "- exit code: \`${RC}\`"
            echo "- tally: ${SUMMARY:-_no summary line_}"
            echo ""
            echo "<details open><summary>Failing files (${NFAIL})</summary>"
            echo ""
            echo '```'
            cat /tmp/failing-files.txt 2>/dev/null || echo "(none)"
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>Failing assertions (first ${NASSERT})</summary>"
            echo ""
            echo '```'
            cat /tmp/failing-assertions.txt 2>/dev/null || echo "(none)"
            echo '```'
            echo "</details>"
            echo ""
            # Open by default: when a file throws rather than asserting, this is
            # the only place the reason appears.
            echo "<details open><summary>Output tail per failing file</summary>"
            echo ""
            echo '```'
            cat /tmp/failing-tails.txt 2>/dev/null || echo "(none)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $RC

      # Always surface the outcome in the job summary so the baseline is
      # readable at a glance without opening the raw log.
      - name: Report outcome
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "### ✅ Test suite passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The suite is green. Promote this workflow to a hard gate by removing \`continue-on-error: true\` from the *Run test suite* step in \`.github/workflows/tests.yml\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠️ Test suite did not pass (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Merges are **not** blocked while the baseline is being established." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Distinguish two very different cases before triaging:**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Symptom | Meaning |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Exit **127**, finishes in well under a minute, no per-file output | Tests **never ran** — a command was not found. Check the *Environment diagnostics* step above. This is infrastructure, not a real test failure. |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Per-file \`PASS\`/\`FAIL\` lines and an \`N/M test files passed\` tally | Tests **did run**; the listed files genuinely failed. Triage into fix / quarantine / delete. |" >> "$GITHUB_STEP_SUMMARY"
          fi
